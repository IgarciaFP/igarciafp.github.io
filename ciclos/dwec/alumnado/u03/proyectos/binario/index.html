<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversor binario a decimal</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body><main>
<h1>Conversor binario a decimal</h1>
<p>Comprueba cómo se representa un número usando únicamente dos dígitos.</p>
<form id="conversor" novalidate>
<label for="binario">Número binario (de 1 a 8 bits)</label>
<input id="binario" name="binario" type="text" inputmode="numeric">
<p id="pista">Escribe solo ceros y unos. Por ejemplo: 1010.</p>
<button type="submit">Convertir</button>
</form>
<p>Decimal: <output id="resultado">—</output></p>
<p id="mensaje" class="mensaje"></p>
</main></body>
</html>
