<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist del cuestionario</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body><main>
<h1>Checklist del cuestionario</h1>
<p>Realiza cada prueba en el cuestionario y marca la casilla cuando hayas comprobado su resultado.</p>
<section id="comprobaciones">
<label><input type="checkbox"> Enviar sin seleccionar mantiene la pregunta y muestra un aviso</label>
<label><input type="checkbox"> La puntuación es correcta con todas, ninguna y algunas respuestas acertadas</label>
<label><input type="checkbox"> Cada nueva pregunta aparece sin opciones marcadas</label>
<label><input type="checkbox"> Reiniciar a mitad y al final restablece todo el cuestionario</label>
<label><input type="checkbox"> Dos partidas seguidas y la navegación con teclado funcionan</label>
</section>
<p id="resumen">0 de 5 comprobaciones completadas</p>
<p id="pendientes"></p>
<button id="reiniciar" type="button">Desmarcar todas</button>
</main></body>
</html>
