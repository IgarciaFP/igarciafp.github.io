<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist antes de entregar</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body><main>
<h1>Checklist antes de entregar</h1>
<p>Verifica tu práctica antes de enviarla.</p>
<section id="comprobaciones">
<label><input type="checkbox"> El script está enlazado con defer</label>
<label><input type="checkbox"> No hay errores en consola</label>
<label><input type="checkbox"> He probado entradas válidas</label>
<label><input type="checkbox"> He probado casos límite</label>
<label><input type="checkbox"> He incluido todos los archivos</label>
</section>
<p id="resumen" aria-live="polite">0 de 5 comprobaciones completadas</p>
<p id="pendientes"></p>
<button id="reiniciar" type="button">Desmarcar todas</button>
</main></body>
</html>
