<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reto JavaScript: cinco preguntas</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body><main>
<h1>Reto JavaScript: cinco preguntas</h1>
<p>Comprueba lo aprendido en la unidad. Cada respuesta cuenta una sola vez.</p>
<form id="cuestionario" novalidate>
<p id="avance">Pregunta 1 de 5</p>
<fieldset><legend id="pregunta">Completa app.js para cargar las preguntas.</legend>
<label><input type="radio" name="respuesta" value="0"><span id="opcion0">Opción A</span></label>
<label><input type="radio" name="respuesta" value="1"><span id="opcion1">Opción B</span></label>
<label><input type="radio" name="respuesta" value="2"><span id="opcion2">Opción C</span></label>
</fieldset>
<button id="responder" type="submit">Responder</button>
</form>
<p id="mensaje" class="mensaje"></p>
<p id="resultado"></p>
<button id="reiniciar" type="button">Reiniciar cuestionario</button>
</main></body>
</html>
