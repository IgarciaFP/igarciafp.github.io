<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diseñador de una tarjeta</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body><main>
<h1>Diseñador de una tarjeta</h1>
<p>Usa los controles para personalizar una tarjeta ya preparada.</p>
<label for="color">Color del texto</label><input id="color" type="color" value="#172033">
<label for="tamano">Tamaño de letra (12–32 px)</label><input id="tamano" type="range" min="12" max="32" value="18">
<label for="radio">Esquinas redondeadas (0–30 px)</label><input id="radio" type="range" min="0" max="30" value="8">
<article id="tarjeta" class="panel"><h2>Mi próximo proyecto</h2><p>Estoy aprendiendo a dar vida a una página con JavaScript.</p></article>
<p id="resumen" aria-live="polite"></p>
</main></body>
</html>
