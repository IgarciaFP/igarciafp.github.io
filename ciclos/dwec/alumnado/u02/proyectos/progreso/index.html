<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi meta de ocho pasos</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="app.js" defer></script>
</head>
<body><main>
<h1>Mi meta de ocho pasos</h1>
<p>Organiza una tarea larga en pasos y comprueba cuánto has avanzado.</p>
<p>Completa ocho pasos de una tarea y registra tu progreso.</p>
<progress id="progreso" max="8" value="0" aria-label="Pasos completados"></progress>
<p id="resumen" aria-live="polite">0 de 8 pasos (0 %)</p>
<button id="sumar" type="button">Completar paso</button>
<button id="deshacer" type="button">Deshacer</button>
<button id="reiniciar" type="button">Reiniciar</button>
</main></body>
</html>
