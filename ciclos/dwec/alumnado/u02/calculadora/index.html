<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora · Práctica de DWEC U02</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="calculadora">
        <header>
            <p class="etiqueta">DWEC · Unidad 2</p>
            <h1>Calculadora</h1>
            <p>Introduce dos números y selecciona una operación.</p>
        </header>
        <form id="formulario-calculadora" novalidate>
            <div class="operandos">
                <div class="campo">
                    <label for="numero1">Primer número</label>
                    <input id="numero1" name="numero1" type="number" step="any" inputmode="decimal">
                </div>
                <div class="campo">
                    <label for="numero2">Segundo número</label>
                    <input id="numero2" name="numero2" type="number" step="any" inputmode="decimal">
                </div>
            </div>
            <div class="campo">
                <label for="operacion">Operación</label>
                <select id="operacion" name="operacion">
                    <option value="sumar">Sumar (+)</option>
                    <option value="restar">Restar (−)</option>
                    <option value="multiplicar">Multiplicar (×)</option>
                    <option value="dividir">Dividir (÷)</option>
                </select>
            </div>
            <div class="acciones">
                <button id="calcular" type="submit">Calcular</button>
                <button id="limpiar" type="button" class="secundario">Limpiar</button>
            </div>
        </form>
        <section class="panel-resultado" aria-labelledby="titulo-resultado">
            <h2 id="titulo-resultado">Resultado</h2>
            <output id="resultado" for="numero1 numero2 operacion" aria-live="polite">—</output>
            <p id="mensaje" class="mensaje" role="status"></p>
        </section>
        <footer>Práctica de JavaScript · HTML y CSS proporcionados</footer>
    </main>
</body>
</html>
