<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Par o impar</title>
</head>
<body>

    <input type="number" id="numero" name="numero" step="1" required>

  </form>
  <p id="resultado" aria-live="polite"></p>
</body>
</html>
