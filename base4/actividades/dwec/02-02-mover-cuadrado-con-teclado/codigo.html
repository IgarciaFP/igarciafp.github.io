<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mover cuadrado con teclado</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }
    #tablero {
      position: relative;
      width: 500px;
      height: 300px;
      border: 3px solid #333;
      background-color: #f4f4f4;
      margin-top: 15px;
    }
    #cuadrado {
      position: absolute;
      top: 0px;
      left: 0px;
      width: 50px;
      height: 50px;
      background-color: #e74c3c;
    }
  </style>
</head>
<body>
  <p id="coordenadas">Posición: X = 0, Y = 0</p>
  <div id="tablero">
    <div id="cuadrado"></div>
  </div>
</body>
</html>
