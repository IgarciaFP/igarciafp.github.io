<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posiciona los rectángulos</title>
</head>
<body>
  <main class="pagina">
    <h1>Posiciona los rectángulos</h1>
    <section aria-labelledby="titulo-a">
      <h2 id="titulo-a">A · Cuatro esquinas</h2>
      <div class="escena esquinas">
        <div class="rectangulo rojo">1</div>
        <div class="rectangulo verde">2</div>
        <div class="rectangulo azul">3</div>
        <div class="rectangulo amarillo">4</div>
      </div>
    </section>
    <section aria-labelledby="titulo-b">
      <h2 id="titulo-b">B · Escalera superpuesta</h2>
      <div class="escena escalera">
        <div class="rectangulo rojo">1</div>
        <div class="rectangulo verde">2</div>
        <div class="rectangulo azul">3</div>
        <div class="rectangulo amarillo">4</div>
      </div>
    </section>
    <section aria-labelledby="titulo-c">
      <h2 id="titulo-c">C · Las capas al revés</h2>
      <div class="escena capas">
        <div class="rectangulo rojo">1</div>
        <div class="rectangulo verde">2</div>
        <div class="rectangulo azul">3</div>
        <div class="rectangulo amarillo">4</div>
      </div>
    </section>
    <p class="despues">Este párrafo debe permanecer debajo de las tres escenas.</p>
  </main>
</body>
</html>
