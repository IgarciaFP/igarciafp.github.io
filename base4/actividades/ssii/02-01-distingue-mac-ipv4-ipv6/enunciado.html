<h3>Distingue MAC, IPv4 e IPv6</h3><p>Una dirección de enlace y una dirección IP cumplen funciones diferentes. Compara estos ejemplos:</p><ul><li>MAC: <code>02:11:22:33:44:55</code>.</li><li>IPv4: <code>192.0.2.10</code>.</li><li>IPv6: <code>2001:db8::10</code>.</li></ul><p>Responde con tus propias palabras y utiliza los ejemplos para justificar tus explicaciones.</p>
