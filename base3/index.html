<!doctype html>
<!--
==========================================================================================
 CÓMO PREPARAR UNA PRÁCTICA CON ESTA PLANTILLA (base3 · taller de código)
==========================================================================================
 No hace falta tocar este archivo ni la carpeta motor/. Todo lo que cambia de una práctica
 a otra está en la carpeta contenido/:

   contenido/config.json      nombre de la práctica, correo admitido y destino de entrega
   contenido/enunciado.html   texto de la actividad a realizar
   contenido/codigo.html      código HTML de partida (pestaña HTML del editor)
   contenido/codigo.css       código CSS de partida (pestaña CSS del editor)
   contenido/codigo.js        código JavaScript de partida (pestaña JavaScript del editor)

 Para crear una práctica nueva, copia la carpeta base3 completa con otro nombre (por
 ejemplo /labs/diw-tarjeta/) y sigue los cuatro pasos.

 ..........................................................................................
 1. NOMBRE DE LA PRÁCTICA                                          contenido/config.json
 ..........................................................................................
   "title"        Nombre que ve el alumno: en la pantalla de identificación, en la barra
                  superior y en la pestaña del navegador.
                  Ejemplo: "DIW · U03 · Tarjeta de presentación"
   "id"           Identificador interno, único para cada práctica, sin espacios. Queda
                  anotado en cada entrega y, si usas la hoja de cálculo, es el que hay
                  que dar de alta en el receptor (paso 2). Ejemplo: "DIW-U03-TARJETA"
   "version"      Versión del enunciado, entre comillas: "1". Súbela a "2", "3"… cuando
                  cambies el enunciado o el código de partida con la práctica ya en uso.
   "filePrefix"   Prefijo de los archivos de «Guardar y pausar», en minúsculas y sin
                  espacios. Ejemplo: "diw-u03-tarjeta". El archivo de entrega no lo usa:
                  se llama como el "title" seguido del usuario (paso 2).
   "emailDomain"  Dominio obligatorio del correo con el que se identifica el alumno.
                  Ejemplo: "g.educaand.es"
   "storage"      Tres claves ("key", "legacyKey" y "recovery") con las que el navegador
                  guarda el intento. Deben ser distintas de las de cualquier otra práctica
                  del sitio; si se repiten, se mezclan los intentos de dos prácticas.
                  Lo más sencillo es usar el prefijo anterior:
                  "diw-u03-tarjeta-v1", "diw-u03-tarjeta-anterior-v1" y
                  "diw-u03-tarjeta-ultima-entrega-v1"
   "format.save"  Identificador de los archivos de «Guardar y pausar». Único por práctica,
                  para que no se pueda recuperar aquí un archivo de otra.
                  Ejemplo: "DIW-U03-TARJETA-SAVE"
   No cambies "format.report" ni "format.checksum" (son comunes a todos los laboratorios)
   ni "requireFullName" (debe ser false para que no se pida el nombre).

 ..........................................................................................
 2. DESTINO DE ENTREGA                                             contenido/config.json
 ..........................................................................................
   Hay dos formas de entrega. Se elige en "delivery":

   A) ARCHIVO (por defecto). No necesita ninguna configuración externa:

        "delivery": { "type": "archivo" }

      Al pulsar «Entregar», el navegador del alumno descarga UN ÚNICO archivo de texto,
      llamado «NOMBRE DE LA ACTIVIDAD_USUARIO.txt», comprimido (gzip) y codificado (base64).
      El nombre de la actividad es el "title" del paso 1 y el usuario es la parte del
      correo anterior a la arroba: «DIW · U03 · Tarjeta de presentación_ana.perez.txt».
      Contiene SOLO las pestañas que el alumno ha modificado respecto al código de partida
      (HTML, CSS, JavaScript y sus notas), junto con el correo, el tiempo empleado y el
      registro de incidencias. Las pestañas sin cambios no se incluyen: su contenido es el
      de contenido/codigo.*. El alumno te lo hace llegar como le indiques (Moodle,
      Classroom, correo…).
      Para revisarlos, abre profesor.html (en esta misma carpeta) y arrastra los archivos:
      muestra el código de cada alumno con sus cambios resaltados y su resultado.

   B) HOJA DE CÁLCULO. Además de descargar el archivo, envía la entrega a una hoja de
      Google Sheets a través del receptor de Apps Script (archivos y guía completa en
      /base/receptor/README.md). Hacen falta las DOS partes:

      a) En el receptor (Google Sheets → Extensiones → Apps Script → Code.gs), añade la
         práctica a la lista CONFIGURACION_ con el mismo "id" y "version" del paso 1:

           { practiceId: 'DIW-U03-TARJETA', versions: ['1'], spreadsheetId: '',
             origin: 'https://igarciafp.github.io', emailDomain: 'g.educaand.es' }

         Con spreadsheetId: '' se usa la hoja a la que está vinculado el script. Conserva
         en la lista las demás prácticas activas. Después selecciona la función
         configurarReceptor_ y pulsa «Ejecutar». Si cambias la versión en config.json,
         añádela también aquí: versions: ['1','2'].
         Si es un receptor nuevo, publícalo con Implementar → Nueva implementación →
         Aplicación web. Si ya estaba publicado, su dirección no cambia.

      b) En contenido/config.json, pon la dirección de la aplicación web del receptor,
         la que termina en /exec:

           "delivery": {
             "type": "apps-script",
             "endpoint": "https://script.google.com/macros/s/ID_DE_LA_IMPLEMENTACION/exec"
           }

      Con "apps-script" y "endpoint" vacío, la página avisa de que falta el destino de
      entrega y el botón «Empezar» permanece desactivado. Antes de usarla en clase haz
      una entrega de prueba y comprueba que aparece en la pestaña «Entregas» de la hoja.
      En la hoja, cada entrega tiene una respuesta por pestaña modificada (html, css, js
      o txt); si el alumno no cambió nada, una sola respuesta vacía llamada sin-cambios. Como no se pide el
      nombre, la columna «Nombre» recibe la parte del correo anterior a la arroba.

 ..........................................................................................
 3. ACTIVIDAD A REALIZAR                                        contenido/enunciado.html
 ..........................................................................................
   Escribe ahí el enunciado en HTML normal: se muestra bajo la barra superior, encima de
   los dos paneles, en una tarjeta desplegable que aparece abierta al empezar y que el
   alumno puede plegar pulsando «Actividad» para dejar más espacio al código. Es solo un fragmento; no lleva <html>, <head> ni <body>. Ejemplo:

        <h3>Título de la actividad</h3>
        <p>Explicación de lo que hay que conseguir.</p>
        <ol>
          <li><strong>HTML:</strong> primera tarea.</li>
          <li><strong>CSS:</strong> segunda tarea, con <code>border-radius</code>.</li>
        </ol>

   Puedes usar títulos (<h3>), párrafos, listas, <strong>, <code>, tablas e imágenes. Si el
   texto es largo, el enunciado muestra su propia barra de desplazamiento. No uses
   atributos id que ya existan en esta página (html, css, js, lab, report, student…): la
   plantilla comprueba los duplicados y no arranca si encuentra alguno.

 ..........................................................................................
 4. CÓDIGO HTML, CSS Y JAVASCRIPT DE PARTIDA                          contenido/codigo.*
 ..........................................................................................
   Escribe cada lenguaje en su archivo, tal cual, sin comillas ni caracteres de escape:

        contenido/codigo.html   →  pestaña HTML
        contenido/codigo.css    →  pestaña CSS
        contenido/codigo.js     →  pestaña JavaScript

   No hay que enlazarlos entre sí. En codigo.html NO pongas <link rel="stylesheet"> ni
   <script src="…">: la plantilla une los tres archivos al mostrar el resultado (el CSS se
   aplica antes del HTML y el JavaScript se ejecuta al final, con el documento ya cargado).
   En codigo.html basta el contenido de la página (lo que iría dentro de <body>); también
   admite un documento completo con <!doctype html>, <head> y <body>.

   El alumno encuentra este código ya escrito en la pestaña correspondiente del editor
   (HTML, CSS o JavaScript) al empezar el intento, y trabaja sobre él. El resultado de la
   derecha lo muestra desde el primer momento. Si quieres que una pestaña empiece en
   blanco, deja vacío su archivo.

   El editor tiene además una cuarta pestaña, TXT, siempre vacía al empezar, para que el
   alumno anote lo que necesite. No afecta al resultado y no tiene archivo de partida. En
   la entrega, esas notas llegan como respuesta "txt", dentro de un comentario /* … */.

   No borres ninguno de los tres archivos aunque esté vacío: la plantilla necesita que
   existan. Cada archivo admite 10 000 caracteres como máximo.
   El resultado no puede cargar hojas de estilo ni scripts de otros sitios (Bootstrap por
   CDN, por ejemplo) ni hacer peticiones de red; las imágenes y las fuentes por https sí
   se cargan. Tampoco funcionan confirm() ni prompt(); alert() se muestra en la consola.

 ..........................................................................................
 ANTES DE PUBLICAR
 ..........................................................................................
   · Si modificas una práctica que ya estaba publicada, cambia el valor de "v=" en las tres
     direcciones de este archivo que lo llevan (dos <link> y un <script>), para que los
     navegadores no usen la versión anterior guardada en caché.
   · Para probar en tu ordenador, ejecuta  python3 -m http.server 8000  en la raíz del
     repositorio y abre http://localhost:8000/base3/ (no funciona abriendo el archivo con
     doble clic, y necesita la carpeta /base/motor/ del mismo sitio).
   · Más detalles en README.md.
==========================================================================================
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio</title>
<link rel="stylesheet" href="/base/motor/estilos.css?v=20261116-base3-8">
<link rel="stylesheet" href="motor/taller.css?v=20261116-base3-8">
</head>
<body>

<header id="practice-toolbar" hidden>
  <div class="topline">Laboratorio</div>
  <div class="toolbar-actions">
    <button id="practice-save" type="button" disabled data-text="savePractice">Guardar y pausar</button>
    <button id="practice-recover" type="button" disabled data-text="recoverPractice">Recuperar práctica</button>
    <button id="practice-reset" type="button" disabled data-text="toolbarReset">Reiniciar</button>
    <input id="practice-file" type="file" accept=".txt,.json,text/plain,application/json" hidden>
    <div class="toolbar-clock"><span data-text="elapsed"></span> <output id="clock" class="clock">00:00</output></div>
    <details id="event-details"><summary id="toolbar-count">Incidencias</summary><ul id="guard-log"></ul></details>
    <button id="practice-finish" type="button" disabled data-text="toolbarFinish">Entregar</button>
  </div>
  <p id="reportStatus" role="status"></p>
  <p id="practice-file-status" role="status" hidden></p>
</header>

<noscript><p class="wrap note">Activa JavaScript para continuar.</p></noscript>

<section id="guard-boot" class="wrap card" hidden>
  <h2>Error</h2>
  <p id="guard-boot-detail"></p>
</section>

<!-- Identificación: solo el correo del centro. Sin selección de idioma ni nombre. -->
<section id="setup-stage" class="stages" hidden>
  <h1 id="lab-title" class="lab-title">Laboratorio</h1>
  <section id="guard-panel" class="card guard-panel" hidden inert>
    <div class="setup-only">
      <h2 data-text="identification"></h2>
      <div id="guard-start-box">
        <div class="identity">
          <div>
            <label for="student"><span data-text="email"></span></label>
            <input id="student" type="email" maxlength="254" required autocomplete="email" placeholder="nombre@g.educaand.es">
          </div>
        </div>
        <p id="identity-error" class="error" role="status"></p>
        <div class="actions"><button id="guard-start" disabled type="button"></button></div>
      </div>
    </div>
    <div id="active-status">
      <div class="guard-state"><span id="guard-state"></span><span id="guard-count"></span></div>
      <p id="guard-conditions"></p>
    </div>
    <p id="guard-action-status" role="status"></p>
    <div id="guard-problem" hidden>
      <p id="guard-problem-text"></p>
      <button id="guard-retry" type="button"><span data-text="retrySave"></span></button>
    </div>
  </section>
</section>

<main id="cuaderno" class="taller" hidden inert>
<form id="lab" novalidate autocomplete="off">

  <!-- 1. Enunciado de la actividad (contenido/enunciado.html): tarjeta desplegable, abierta al inicio. -->
  <details id="statement" class="enunciado" open>
    <summary><span class="eyebrow">Actividad</span></summary>
    <div id="activity-text" class="enunciado-texto"></div>
  </details>

  <!-- 2. Dos paneles: editor a la izquierda y resultado a la derecha. -->
  <div class="paneles">
    <section class="panel" aria-labelledby="editor-title">
      <header class="panel-cabecera">
        <h2 id="editor-title">Tu código</h2>
        <div class="pestanas" role="tablist" aria-label="Lenguaje del editor">
          <button type="button" role="tab" data-editor="html" aria-controls="html">HTML</button>
          <button type="button" role="tab" data-editor="css" aria-controls="css">CSS</button>
          <button type="button" role="tab" data-editor="js" aria-controls="js">JavaScript</button>
          <button type="button" role="tab" data-editor="txt" aria-controls="txt" title="Notas: no afectan al resultado y se entregan como comentario">TXT</button>
        </div>
      </header>
      <!-- Cerrado hasta identificarse y activar la pantalla completa. -->
      <fieldset id="answer-fields" class="editores" disabled>
        <button id="editor-restore" type="button" class="restaurar" disabled>↺ Restaurar</button>
        <textarea id="html" class="editor" role="tabpanel" aria-label="Código HTML" maxlength="10000" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
        <textarea id="css" class="editor" role="tabpanel" aria-label="Código CSS" maxlength="10000" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" hidden></textarea>
        <textarea id="js" class="editor" role="tabpanel" aria-label="Código JavaScript" maxlength="10000" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" hidden></textarea>
        <textarea id="txt" class="editor notas" role="tabpanel" aria-label="Notas en texto" maxlength="9900" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Notas para el profesor (opcional). No afectan al resultado." hidden></textarea>
      </fieldset>
      <p class="panel-pie"><span id="editor-count"></span><span id="saveStatus" class="guardado" role="status"></span></p>
    </section>

    <section class="panel" aria-labelledby="preview-title">
      <header class="panel-cabecera">
        <h2 id="preview-title">Resultado</h2>
        <span id="preview-status" class="panel-estado" role="status"></span>
        <button id="preview-refresh" type="button" class="secondary" title="Vuelve a cargar solo el resultado, sin tocar el código, el reloj ni el resto de la página">↻ Actualizar</button>
        <button id="preview-run" type="button">▶ Ejecutar</button>
      </header>
      <iframe id="preview" class="vista" title="Resultado de tu código" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
      <details id="console-box" class="consola" open>
        <summary>Consola <span id="console-count"></span></summary>
        <ol id="preview-console" aria-live="polite"></ol>
      </details>
    </section>
  </div>

  <div hidden><button id="guard-finish" type="button" disabled></button></div>
</form>
</main>

<section id="delivery-stage" class="card" hidden>
  <h2 data-text="deliveryTitle"></h2>
  <p id="delivery-status" role="status"></p>
  <button id="delivery-retry" type="button"><span data-text="copyOpen"></span></button>
  <p class="note"><span data-text="deliveryNote"></span></p>
  <button id="delivery-back" class="secondary" type="button" hidden><span data-text="backStart"></span></button>
</section>

<div id="recovery" class="wrap" hidden>
  <p id="recovery-message"></p>
  <button id="recover-delivery" type="button"><span data-text="recover"></span></button>
</div>

<textarea id="report" hidden disabled></textarea>
<button id="download" hidden disabled></button>
<button id="reset" hidden disabled></button>

<dialog id="guard-warning" class="guard-dialog" aria-labelledby="guard-warning-title" aria-describedby="guard-warning-text">
  <h2 id="guard-warning-title"></h2>
  <p id="guard-warning-text"></p>
  <p id="guard-warning-count"></p>
  <p id="guard-warning-error"></p>
  <button id="guard-continue" type="button"></button>
</dialog>

<dialog id="guard-confirm" class="guard-dialog" aria-labelledby="guard-confirm-title" aria-describedby="guard-confirm-text">
  <h2 id="guard-confirm-title"></h2>
  <p id="guard-confirm-text"></p>
  <div class="actions">
    <button id="guard-confirm-cancel" class="secondary" type="button" autofocus><span data-text="cancel"></span></button>
    <button id="guard-confirm-ok" type="button"><span data-text="confirm"></span></button>
  </div>
</dialog>

<script src="motor/cargador.js?v=20261116-base3-8" defer></script>
</body>
</html>
