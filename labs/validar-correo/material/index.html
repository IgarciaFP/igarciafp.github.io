<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validar una edad</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <form id="formulario" novalidate>
            <label for="edad">Edad</label>
            <input id="edad" name="edad" type="number" min="1" max="120" step="1" required placeholder="Introduce tu edad">
            <button type="submit">Aceptar</button>
            <output id="mensaje" for="edad"></output>
        </form>
    </main>
</body>
</html>
