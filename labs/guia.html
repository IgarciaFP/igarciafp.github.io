initial.learning={"requirements":[{"quote":"","need":"","decision":""},{"quote":"","need":"","decision":""},{"quote":"","need":"","decision":""}],"logoTest":"","challengeColor":"#b9b9b9","colorLesson":"","typeBase":16,"typeRatio":1.2,"typeTest":"","iconPreviews":[{"data":""},{"data":""},{"data":""},{"data":""}],"writingTest":"","atom":"","molecule":"","organism":"","principle":"Proximidad","principleReason":"","tokenObservation":"","stateTest":"","peer":{"name":"","tasks":[{"result":"","observation":""},{"result":"","observation":""},{"result":"","observation":""}],"problem":"","change":"","retest":"","confirmed":false},"rubric":[{"level":"","evidence":""},{"level":"","evidence":""},{"level":"","evidence":""},{"level":"","evidence":""}]};
let state=structuredClone(initial), active=0, wfPage='landing', wfDevice='mobile',previewDevice='mobile',previewPage='landing';
const KEY='migas-guia-v1';let saveTimer,toastTimer,storageWarning=false;
function notify(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500)}
function get(path){return path.split('.').reduce((a,k)=>a?.[k],state)}
function set(path,value){const parts=path.split('.');const last=parts.pop();let o=state;for(const p of parts)o=o[p];o[last]=value;invalidate();if(path.startsWith('color.')){state.reviewed[1]=false;state.reviewed[6]=false;}if(path.startsWith('type.')||path.startsWith('writing.'))state.reviewed[6]=false;if(path==='learning.stateTest')state.reviewed[6]=false;updateNav();if($('#learning-validation'))$('#learning-validation').textContent='Validación pendiente: revisa las evidencias tras los cambios.';save();}
function invalidate(){if($('#report').innerHTML){$('#report').innerHTML='';$('#report').className='report';}if(active>=1&&active<=7)state.reviewed[active-1]=false;state.learning.peer.confirmed=false;updateNav()}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));storageWarning=false;$('#save-status').textContent='Guardado en este navegador · '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});}catch(e){storageWarning=true;$('#save-status').textContent='No se pudo guardar aquí. Descarga «Guardar trabajo» para conservar tus cambios.';}},300)}
function safeImport(raw){if(!raw||raw.schema!==1||!Array.isArray(raw.images)||raw.images.length!==4)throw Error('Formato de trabajo no reconocido.');const out=structuredClone(initial);function copy(dst,src){for(const k of Object.keys(dst)){if(!(k in src))continue;if(k==='values'){dst[k]=Array.isArray(src[k])?src[k].filter(x=>['Tradición','Cercanía','Artesanía','Honestidad','Sostenibilidad'].includes(x)).slice(0,5):[];continue;}if(Array.isArray(dst[k])){if(Array.isArray(src[k])&&src[k].length===dst[k].length)dst[k].forEach((v,i)=>{if(v&&typeof v==='object')copy(v,src[k][i]||{});else if(typeof v===typeof src[k][i])dst[k][i]=src[k][i]});}else if(dst[k]&&typeof dst[k]==='object'){if(src[k]&&typeof src[k]==='object')copy(dst[k],src[k]);}else if(typeof dst[k]===typeof src[k]){if(typeof src[k]==='string'){if(k==='data'||k==='customLogo'){if(src[k]===''||/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src[k])&&src[k].length<1700000)dst[k]=src[k];else throw Error('Imagen no admitida.');}else dst[k]=src[k].slice(0,1800);}else if(typeof src[k]==='number'){if(Number.isFinite(src[k]))dst[k]=src[k];}else dst[k]=src[k];}}}copy(out,raw);if(!['analogous','complementary','triadic','monochromatic'].includes(out.color.harmony))out.color.harmony='analogous';for(const k of colorKeys)if(!/^#[\da-f]{6}$/i.test(out.color[k]))out.color[k]=initial.color[k];for(const k of ['heading','body'])if(!fonts.includes(out.type[k]))out.type[k]=initial.type[k];for(const k of Object.keys(out.type.sizes)){out.type.sizes[k]=out.type.sizes[k].map((n,i)=>i===2?[400,600,700].includes(n)?n:600:Math.max(12,Math.min(80,n)));}out.type.line=Math.max(1.3,Math.min(2,out.type.line));out.step=Math.max(0,Math.min(8,Math.round(out.step)));out.ui.spacing=[4,8,12].includes(out.ui.spacing)?out.ui.spacing:8;out.color.hue=(Math.round(Math.max(0,Math.min(360,out.color.hue))/30)*30)%360;out.color.sat=Math.max(0,Math.min(100,out.color.sat));out.color.light=Math.max(0,Math.min(100,out.color.light));for(const im of out.images){if(!['16:9','4:3','1:1','3:2'].includes(im.crop))im.crop='4:3';if(!['center','top','left','right'].includes(im.position))im.position='center';}for(const [k,allowed] of Object.entries({button:['suave','recto','pill'],card:['borde','sombra','plana'],field:['borde','relleno','linea'],modal:['centrado','lateral','inferior']}))if(!allowed.includes(out.ui[k]))out.ui[k]=initial.ui[k];out.icons.size=Math.max(16,Math.min(32,out.icons.size));if(!/^#[\da-f]{6}$/i.test(out.learning.challengeColor))out.learning.challengeColor='#b9b9b9';out.learning.typeBase=[16,18,20].includes(out.learning.typeBase)?out.learning.typeBase:16;out.learning.typeRatio=[1.125,1.2,1.25].includes(out.learning.typeRatio)?out.learning.typeRatio:1.2;out.learning.peer.confirmed=false;out.reviewed=Array(7).fill(false);return out;}
function field(path,label,help='',type='text',opts=[]){const value=get(path);return `<label class="field">${esc(label)}${help?`<small>${help}</small>`:''}${type==='textarea'?`<textarea data-path="${path}" maxlength="500">${esc(value)}</textarea>`:type==='select'?`<select data-path="${path}">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`:`<input data-path="${path}" type="${type}" value="${esc(value)}" ${type==='number'?'min="12" max="80"':'maxlength="180"'}>`}</label>`}
function sectionHead(n,title,desc){return `<div class="intro"><p class="eyebrow">${n===0?'El punto de partida':n===8?'Tu entrega':`Paso ${n} de 7`}</p><h1>${title}</h1><p>${desc}</p></div>${lessonRoute(n)}`}
function updateNav(){const count=state.reviewed.filter(Boolean).length;$('#steps').innerHTML=names.map((n,i)=>`<button class="step-link ${i>0&&i<8&&state.reviewed[i-1]?'done':''}" data-go="${i}" ${active===i?'aria-current="step"':''}><span>${i>0&&i<8&&state.reviewed[i-1]?'✓':i===0?'↗':i===8?'↓':i}</span>${n}</button>`).join('');$('#bar').style.width=(count/7*100)+'%';$('.progress').setAttribute('aria-valuenow',count);$('#progress-label').textContent=`${count} de 7 pasos comprobados`;}

function render(){updateNav();$('#content').innerHTML=[brief,identity,colors,typography,images,icons,writing,components,review][active]()+`<div class="step-footer">${active>0?`<button data-go="${active-1}">← Anterior</button>`:'<span></span>'}${active<8?`<button class="primary" data-go="${active+1}">${active===0?'Empezar la identidad':active===7?'Revisar mi guía':'Continuar'} →</button>`:'<button data-go="0">Volver al encargo</button>'}</div>`;refreshVisuals();}
const interview=[
['¿Qué hace especial a Migas Amigas?','Somos Elena y Tomás. Nuestra familia lleva tres generaciones haciendo pan en el barrio. Trabajamos con masa madre, fermentaciones largas y harinas de un molino cercano. Preferimos explicar cómo hacemos el pan a presumir de ser los mejores.'],
['¿Para qué necesitáis la web?','Queremos vender online y que la gente pueda reservar el pan antes de salir de casa. La primera fase será recoger en tienda; más adelante estudiaremos reparto de proximidad. No vamos a prometer entregas que aún no podemos atender.'],
['¿Quién va a comprar?','Clientes del barrio, familias y personas que llegan desde el móvil camino del trabajo. También personas mayores que nos conocen de toda la vida. Queremos textos cómodos de leer y una compra sin tener que crear una cuenta.'],
['¿Cómo debe sentirse la marca?','Tradicional, cálida, honesta y cercana, como entrar en nuestro obrador. Artesana sin parecer antigua ni exclusiva. Nada de lujo frío, descuentos agresivos o frases complicadas.'],
['¿Qué debe verse primero?','El pan artesano, cómo se hace y un acceso claro a comprar. Empezamos con tres productos: hogaza de masa madre, barra rústica y pan de semillas. Cada tarjeta debe enseñar foto, nombre, peso, precio y acceso a ingredientes y alérgenos.'],
['¿Qué significa una compra sencilla?','Elegir pan, añadirlo a la cesta, escoger una franja de recogida y confirmar el pedido viendo el precio total. Siempre debemos poder cambiar cantidades y corregir errores. No pediremos datos que no necesitemos.'],
['¿Qué mantenemos del logotipo?','El nombre Migas Amigas tiene que seguir siendo reconocible. Queremos un símbolo de espiga o de pan que pueda usarse junto al nombre y también por separado. Debe leerse en el móvil, en una bolsa y en una etiqueta.'],
['¿Qué imágenes y mensajes usaremos?','Preferimos fotos de nuestras manos y del pan real con luz natural. Si usáis imágenes de ejemplo, deben tener permiso de uso y figurar como referencias, sin hacerlas pasar por fotos del negocio. Hablamos de tú, con amabilidad y sin culpar a nadie cuando hay un error.'],
['¿Qué necesita la página de contacto?','Dirección, horario, teléfono, cómo llegar y un formulario breve: nombre, correo y mensaje. Debe indicar qué campos son obligatorios y explicar el uso de los datos. Para el ejercicio, usad Plaza del Trigo, 8; lunes a sábado de 7:30 a 14:30; teléfono 900 000 000 y hola@migasamigas.example. Son datos ficticios.'],
['¿Cómo sabremos que el diseño funciona?','Si desde el móvil encontramos el pan y la forma de recogerlo sin ayuda. Necesitamos buen contraste, botones cómodos, navegación por teclado y mensajes claros. Elena revisará los cambios de la guía antes de publicarlos.']];
function interviewHTML(){return `<div class="dialogue">${interview.map(([q,a],i)=>`<div class="quote"><span class="avatar" aria-hidden="true">${i+1}</span><div><b>${esc(q)}</b><p>${esc(a)}</p></div></div>`).join('')}</div>`}
function brief(){return `${sectionHead(0,'Del obrador a la pantalla.','Convierte una conversación con el cliente en un sistema de diseño. Decide, comprueba y documenta: al final tendrás una guía de estilo en PDF con tus elecciones.')}<div class="hero-intro"><div class="panel"><p class="eyebrow">Proyecto de aula · caso ficticio</p><h2>Una panadería de barrio.<br>Una nueva forma de comprar.</h2><p>Primero conoce el encargo y la estructura de la web. Después trabajarás una decisión a la vez, con ejemplos editables y una maqueta que responde a tus elecciones.</p><div class="grid">${field('student','Nombre del alumno o equipo')}${field('group','Grupo (opcional)')}</div><p class="small">Tus imágenes y respuestas se procesan en este dispositivo. «Guardar trabajo» descarga una copia JSON para continuar en otro navegador. No introduzcas datos reales de clientes.</p></div><div class="brief-cover">${logoSVG()}<p>Pan de barrio, hecho con tiempo.</p><span class="brief-tag">ENTREVISTA → DECISIONES → GUÍA</span></div></div><details class="panel" open><summary><strong>La entrevista con Elena y Tomás</strong> · Léela antes de diseñar</summary><div style="margin-top:24px">${interviewHTML()}</div></details><section class="panel" id="navigation-map"><p class="eyebrow">La estructura de la web</p><h2>Un mapa de navegación sencillo</h2><p>Desde el menú se accede a <strong>Inicio / tienda</strong>, <strong>Contacto</strong> y <strong>Cesta</strong>. El catálogo forma parte de la landing; la compra continúa desde la cesta.</p>${navigationMapHTML()}<div class="actions" style="margin-top:16px"><button id="download-navigation">Descargar mapa SVG</button></div><p class="small" style="margin-top:14px">La cesta, la recogida y la confirmación representan el recorrido previsto para la futura tienda. Los wireframes de este laboratorio desarrollan la landing y el contacto. Este mapa describe la navegación de las personas, no un archivo sitemap.xml para buscadores.</p></section><section class="panel"><p class="eyebrow">Estructura antes que estilo</p><h2>Cuatro wireframes, un mismo recorrido</h2><p>Partimos de 375 px: una columna y una tarjeta de producto por desplazamiento. Desde 900 px, el hero y el contacto pasan a dos columnas; el carrusel muestra tres tarjetas. No avanza automáticamente.</p><div class="tabs" aria-label="Página del wireframe"><button data-wf-page="landing" aria-pressed="${wfPage==='landing'}">Landing / tienda</button><button data-wf-page="contacto" aria-pressed="${wfPage==='contacto'}">Contacto</button></div><div class="tabs" aria-label="Tamaño del wireframe"><button data-wf-device="mobile" aria-pressed="${wfDevice==='mobile'}">Móvil · 375 px</button><button data-wf-device="desktop" aria-pressed="${wfDevice==='desktop'}">Escritorio · 1200 px</button><button id="download-wire">Descargar este SVG</button></div><div class="wire">${wireSVG(wfPage,wfDevice)}</div><div class="callout"><strong>Contrato de la maqueta</strong><p>Hero + catálogo con compra + contacto. Los botones representan un flujo de compra; este laboratorio no tramita pedidos ni envía formularios. El PDF incluirá los cuatro wireframes.</p></div></section>`}
function logoSVG(){const c=state.color.primary, id=state.identity, stack=id.layout==='vertical',w=stack?300:470,h=stack?215:135;let symbol=id.motif==='hogaza'?'<path d="M18 85 C5 35 89 18 99 65 Q101 90 80 94 H38 Q20 94 18 85Z" fill="none" stroke-width="5"/><path d="M40 42L31 61M62 35L51 57M81 42L69 64" fill="none" stroke-width="4"/>':'<path d="M58 103V28M58 54C30 56 28 31 28 31C52 29 58 48 58 54ZM58 75C29 77 27 52 27 52C51 51 58 68 58 75ZM58 53C86 55 88 30 88 30C64 29 58 47 58 53ZM58 76C86 77 89 53 89 53C65 52 58 69 58 76ZM58 29C39 17 58 3 58 3C77 18 58 29 58 29Z" fill="none" stroke-width="3.5"/>';
return `<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Imagotipo Migas Amigas" viewBox="0 0 ${w} ${h}"><title>Migas Amigas: propuesta de imagotipo para adaptar</title><g stroke="${c}" stroke-linecap="round" stroke-linejoin="round" transform="translate(${stack?92:5},${stack?2:8})">${symbol}</g><text x="${stack?150:132}" y="${stack?160:69}" fill="${c}" text-anchor="${stack?'middle':'start'}" font-family="Georgia,serif" font-weight="700" font-size="${stack?32:36}">Migas Amigas</text><text x="${stack?150:133}" y="${stack?188:98}" fill="${c}" text-anchor="${stack?'middle':'start'}" font-family="Arial,sans-serif" font-size="${stack?11:12}">${esc(id.slogan.slice(0,48))}</text></svg>`;}

function identity(){return `${sectionHead(1,'Define quiénes somos.','Extrae la identidad de la entrevista. Cada decisión debe responder a algo que Elena y Tomás necesitan.')}<div class="callout"><strong>La pista del cliente</strong><p>«Artesana sin parecer antigua ni exclusiva», «compra sin cuenta», «pan del barrio». Usa estas evidencias para justificar tu propuesta.</p></div><div class="panel"><div class="grid">${field('identity.mission','Misión: ¿qué ofrecemos y para quién?','Por ejemplo: facilitar el acceso al pan artesano del barrio mediante una compra sencilla.','textarea')}${field('identity.vision','Visión: ¿hacia dónde queremos ir?','Piensa en la venta online y en mantener el trato cercano.','textarea')}${field('identity.audience','Público prioritario','Concreta quién compra, desde dónde y qué dificultad hay que evitar.','textarea')}${field('identity.personality','Personalidad de la marca','','select',['Cercana y artesanal','Tradicional y sencilla','Honesta y acogedora'])}</div><fieldset><legend>Valores · Elige al menos tres</legend><div class="choice-list">${['Tradición','Cercanía','Artesanía','Honestidad','Sostenibilidad'].map(v=>`<label class="chip"><input type="checkbox" data-value="${v}" ${state.identity.values.includes(v)?'checked':''}>${v}</label>`).join('')}</div></fieldset>${field('identity.evidence','Del encargo a una decisión','Cita una frase de la entrevista y explica qué cambiará en la interfaz gracias a ella.','textarea')}</div><section class="panel"><p class="eyebrow">Tu primera pieza de diseño</p><h2>Adapta el imagotipo</h2><p>Conservamos el nombre del laboratorio anterior. Esta nueva base vectorial añade un símbolo separable: nombre + símbolo forman un <strong>imagotipo</strong>. Modifica aquí su composición o descárgalo y edítalo fuera.</p><div class="grid"><div><div id="logo-preview" class="logo-stage"></div><div class="actions" style="margin:14px 0"><button id="download-logo">Descargar SVG editable</button></div><div class="resource-links">${link('https://editor.method.ac/','Method Draw')}${link('https://boxy-svg.com/app','Boxy SVG')}${link('https://penpot.app/','Penpot')}</div><p class="small">Abre el SVG en un editor, cambia proporciones, tipografía o trazos y guarda una copia. Para incorporarlo al informe, exporta PNG con fondo transparente. Comprueba las condiciones de la herramienta elegida.</p></div><div>${field('identity.motif','Símbolo','','select',[['espiga','Espiga'],['hogaza','Hogaza']])}${field('identity.layout','Composición','','select',[['horizontal','Horizontal'],['vertical','Vertical']])}${field('identity.slogan','Lema','Máximo visible: 48 caracteres. Se colorea con el primario del paso 2.')}<label class="field">Cargar tu adaptación (PNG, JPG o WebP)<input type="file" data-upload="logo" accept="image/png,image/jpeg,image/webp"></label>${state.identity.customLogo?'<button data-remove="logo">Usar de nuevo el SVG base</button>':''}</div></div>${field('identity.logoNote','¿Qué has adaptado y por qué?','Relaciona símbolo, proporciones y legibilidad con la entrevista.','textarea')}<div class="callout"><p><strong>Reglas de uso:</strong> mantén las proporciones y una zona libre equivalente a la altura de la M. Ancho mínimo propuesto: 160 px en horizontal, 120 px en vertical. Prueba también en una tinta. No estires, no añadas sombras ni coloques sobre fotografías con ruido. El PDF recogerá estas reglas.</p></div></section>${logoTests()}${markStep(1)}`}
const colorKeys=['primary','secondary','background','surface','text','success','error','warning','info'];
const colorLabels=['Primario · acciones y marca','Secundario · bloques y detalles','Fondo · dominante','Superficie · tarjetas y campos','Texto · lectura','Éxito · confirmaciones','Error · corrección','Aviso · atención','Información · ayuda'];
function rgb(hex){return hex.slice(1).match(/../g).map(x=>parseInt(x,16))}
function lum(hex){return rgb(hex).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
function ratio(a,b){let x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function onColor(c){return ratio(c,'#ffffff')>=ratio(c,'#000000')?'#ffffff':'#000000'}
function mix(hex,amount){return '#'+rgb(hex).map(v=>Math.round(v*(1-amount)).toString(16).padStart(2,'0')).join('')}
function hsl(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(v=>Math.round(255*v).toString(16).padStart(2,'0')).join('')}
const harmonyInfo={complementary:['Complementario','Dos colores opuestos en la rueda, separados 180°. Útil para diferenciar una acción; el contraste entre texto y fondo se comprueba por separado.'],analogous:['Análogos','Matices vecinos, a 30° a cada lado del color base. Comparten una dirección cromática y permiten una composición tranquila.'],triadic:['Triádico','Tres matices separados 120°. Da protagonismo a uno y reserva los demás para apoyos y acentos.'],monochromatic:['Monocromático','Un mismo matiz con distintos valores de luminosidad. Aporta unidad; usa el contraste para separar texto, fondo y controles.']};
function harmony(){let c=state.color,h=c.hue,s=c.sat,l=c.light;let offsets=c.harmony==='complementary'?[0,180]:c.harmony==='triadic'?[0,120,240]:c.harmony==='monochromatic'?[0]:[0,30,330];return c.harmony==='monochromatic'?[hsl(h,s,l),hsl(h,s,Math.min(95,l+25)),hsl(h,s,Math.max(5,l-20))]:offsets.map(n=>hsl((h+n)%360,s,l));}
function renderGuideWheel(){const c=state.color,info=harmonyInfo[c.harmony]||harmonyInfo.analogous;$('#harmony-title').textContent=info[0];$('#harmony-description').textContent=info[1];$$('[data-harmony]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.harmony===c.harmony));let offsets=c.harmony==='complementary'?[0,180]:c.harmony==='triadic'?[0,120,240]:c.harmony==='monochromatic'?[0]:[0,30,330],selected=offsets.map(n=>(c.hue+n)%360);const point=h=>[200+140*Math.cos((h-90)*Math.PI/180),200+140*Math.sin((h-90)*Math.PI/180)];let lines='';if(selected.length>1){let pts=selected.map(h=>point(h).join(',')).join(' ');lines=selected.length===2?`<polyline points="${pts}" fill="none" stroke="#6366f1" stroke-width="3"/>`:`<polygon points="${pts}" fill="#6366f11c" stroke="#6366f1" stroke-width="3"/>`;}
$('#interactive-wheel').innerHTML=`<svg viewBox="0 0 400 400" role="group" aria-label="Rueda cromática interactiva de doce matices"><circle cx="200" cy="200" r="180" fill="none" stroke="#dce2ec" stroke-dasharray="4 4"/><circle cx="200" cy="200" r="120" fill="none" stroke="#dce2ec" stroke-dasharray="4 4"/>${lines}${Array.from({length:12},(_,i)=>{let h=i*30,[x,y]=point(h),isBase=h===c.hue,isSelected=selected.includes(h);return `<g class="guide-wheel-node" data-wheel-hue="${h}" tabindex="0" role="button" aria-label="Seleccionar matiz ${h} grados" aria-pressed="${isBase}"><circle cx="${x}" cy="${y}" r="23" fill="transparent"/><circle class="node-focus" cx="${x}" cy="${y}" r="22" fill="none" stroke="${isBase?'#172238':'transparent'}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${isSelected?18:13}" fill="${hsl(h,90,50)}" stroke="${isSelected?'white':'transparent'}" stroke-width="3"/></g>`;}).join('')}<circle cx="200" cy="200" r="34" fill="white" stroke="#dce2ec" stroke-width="2"/><text x="200" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#172238">UI COLOR</text><text x="200" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#536077">${c.hue}°</text></svg>`;}
function chooseWheel(h,refocus=false){set('color.hue',Number(h));const slider=$('[data-path="color.hue"]');if(slider)slider.value=h;refreshVisuals();if(refocus)$(`[data-wheel-hue="${h}"]`)?.focus({preventScroll:true});}
document.addEventListener('click',e=>{const node=e.target.closest('[data-wheel-hue]');if(node)chooseWheel(node.dataset.wheelHue);const button=e.target.closest('[data-harmony]');if(button){set('color.harmony',button.dataset.harmony);refreshVisuals();}});
document.addEventListener('keydown',e=>{const node=e.target.closest('[data-wheel-hue]');if(!node)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseWheel(node.dataset.wheelHue,true);}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const direction=['ArrowRight','ArrowDown'].includes(e.key)?30:330;chooseWheel((Number(node.dataset.wheelHue)+direction)%360,true);}});
function contrastRows(){let c=state.color;return [['Texto / fondo',c.text,c.background],['Texto / superficie',c.text,c.surface],['Botón: texto / primario',onColor(c.primary),c.primary],['Enlace / fondo',c.primary,c.background],['Éxito / superficie',c.success,c.surface],['Error / superficie',c.error,c.surface],['Aviso / superficie',c.warning,c.surface],['Información / superficie',c.info,c.surface]]}
function contrastHTML(){return contrastRows().map(([name,a,b])=>{let n=ratio(a,b);return `<div class="ratio"><span>${name}</span><strong class="${n>=4.5?'ok':'error'}">${n.toFixed(2)}:1 · ${n>=4.5?'AA texto':'Revisar'}</strong></div>`}).join('')}
function colors(){return `${sectionHead(2,'Dale color al obrador.','Explora armonías, reparte el protagonismo y comprueba el contraste antes de decidir. Los controles siguen el laboratorio de color del tema.')}<div class="resource-links">${link('https://igarciafp.github.io/labs/colorweb.html','Abrir el laboratorio de color')}</div><section class="panel"><h2>1. Armonía cromática y rueda de color</h2><p>Selecciona un matiz en la rueda de 12 colores y una regla de armonía, como en el laboratorio de color. Después ajusta saturación y luminosidad para adaptarlo a la panadería.</p><div class="color-workbench"><div><fieldset><legend>Esquema de armonía</legend><div class="harmony-options">${Object.entries(harmonyInfo).map(([k,v])=>`<button data-harmony="${k}" aria-pressed="${state.color.harmony===k}">${v[0]}</button>`).join('')}</div></fieldset><div class="harmony-info"><h3 id="harmony-title"></h3><p id="harmony-description" class="small"></p></div><h3>Muestras generadas</h3><div id="harmony-swatches" class="swatches"></div><button id="apply-harmony" style="margin-top:16px">Aplicar a primario y secundario</button><p class="small" style="margin-top:12px">Las líneas muestran la relación entre colores. Aplicar cambia estos dos roles; conserva el resto de tu paleta. Revisa el contraste antes de darla por terminada.</p></div><div><div id="interactive-wheel"></div><p class="small">Pulsa un círculo o usa Tab y Enter. El aro oscuro identifica el matiz base.</p></div></div><details class="tint panel" style="margin-top:20px" open><summary><strong>Ajuste HSL · matiz, saturación y luminosidad</strong></summary><div class="grid three" style="margin-top:16px">${[['hue','Matiz',0,330,30],['sat','Saturación',0,100,1],['light','Luminosidad',0,100,1]].map(([k,l,min,max,step])=>`<label class="field">${l}: <output id="out-${k}">${state.color[k]}</output><input data-path="color.${k}" type="range" min="${min}" max="${max}" step="${step}" value="${state.color[k]}"></label>`).join('')}</div><p class="small">El matiz avanza por los 12 puntos de la rueda. Saturación y luminosidad cambian las muestras. Para valores exactos, utiliza los selectores HEX de la paleta.</p></details></section><section class="panel"><h2>2. Asigna un papel a cada color</h2><div class="grid three">${colorKeys.slice(0,5).map((k,i)=>`<label class="field">${colorLabels[i]}<span class="color-row"><input type="color" data-path="color.${k}" value="${state.color[k]}" aria-label="Selector ${colorLabels[i]}"><input type="text" data-hex="${k}" value="${state.color[k]}" pattern="#[0-9a-fA-F]{6}" maxlength="7" aria-label="Hexadecimal ${colorLabels[i]}"></span></label>`).join('')}</div><details><summary>Opciones avanzadas · colores de estado</summary><div class="grid three">${colorKeys.slice(5).map((k,j)=>{const i=j+5;return `<label class="field">${colorLabels[i]}<span class="color-row"><input type="color" data-path="color.${k}" value="${state.color[k]}" aria-label="Selector ${colorLabels[i]}"><input type="text" data-hex="${k}" value="${state.color[k]}" pattern="#[0-9a-fA-F]{6}" maxlength="7" aria-label="Hexadecimal ${colorLabels[i]}"></span></label>`;}).join('')}</div></details><p class="small">Regla orientativa 60–30–10: fondo dominante, superficies secundarias y acentos. No es una cuota rígida ni un criterio de accesibilidad.</p><div id="proportions" class="proportions"></div>${field('color.reason','Justifica la paleta','Vincula los colores con la entrevista y explica dónde usarás el primario y el secundario.','textarea')}</section><div class="grid"><section class="panel"><h2>3. Verifica el contraste</h2><div id="contrast"></div><p class="small" style="margin-top:14px">Usamos 4,5:1 como mínimo para todos estos textos normales. El texto de botón elige blanco o negro automáticamente. Los estados necesitan además una etiqueta o un icono, nunca solo color.</p>${link('https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html','Criterio WCAG de contraste')}</section><section class="panel"><h3>Decisiones que se ven</h3><div id="color-demo"></div><p class="small" style="margin-top:14px">Si la combinación falla, oscurece el texto o aclara el fondo. El PDF incluye los valores y los ratios medidos.</p></section></div>${previewBlock()}${markStep(2)}`}
function typography(){return `${sectionHead(3,'Una voz que se pueda leer.','Elige dos familias como máximo y define la jerarquía desde el móvil. Los tamaños de escritorio crecen sin cambiar el orden de importancia.')}<div class="resource-links">${link('https://fonts.google.com/','Explorar Google Fonts')}${link('https://fonts.google.com/knowledge','Aprender sobre tipografía')}</div><section class="panel"><div class="grid">${field('type.heading','Familia de títulos','Explora una serif para el carácter artesanal o una sans serif para una identidad más sobria.','select',fonts)}${field('type.body','Familia de lectura y controles','Inter y Source Sans 3 son puntos de partida legibles. Si no hay conexión, se usa una fuente de reserva.','select',fonts)}</div><label class="field">Interlineado de lectura: <output id="line-out">${state.type.line}</output><input data-path="type.line" type="range" min="1.3" max="2" step="0.05" value="${state.type.line}"></label>${typeControls()}<p class="small" style="margin-top:14px">Los niveles H1–H6 describen estructura, no se saltan solo para obtener otro tamaño. Body recomendado: 16 px o más; controles: 16 px. Longitud de línea objetivo: 45–75 caracteres.</p>${field('type.reason','¿Por qué estas familias y esta escala?','Relaciona tradición, facilidad de compra y lectura en móvil.','textarea')}</section><div class="panel"><h3>Prueba de lectura</h3><div id="full-type-preview" class="type-sample"></div>${field('learning.typeTest','Prueba de lectura','Compara móvil y escritorio: jerarquía, saltos de línea y visibilidad de la compra. Explica un ajuste.','textarea')}</div>${previewBlock()}${markStep(3)}`}

es.${i}.alt`,'Texto alternativo','Describe lo relevante sin empezar por «imagen de».')}${field(`images.${i}.author`,'Autor / titular')}${field(`images.${i}.source`,'URL de la página original','Para una foto propia: «Archivo propio» y fecha. Sin enlaces a búsquedas.')}${field(`images.${i}.license`,'Licencia o permiso','Nombre de la licencia, versión o permiso del titular.')}${field(`images.${i}.proof`,'Condiciones y atribución','Indica si permite uso comercial/modificación, cómo citarás y cuándo lo consultaste.','textarea')}<div class="grid">${field(`images.${i}.crop`,'Relación de aspecto','','select',i?['4:3','1:1','3:2']:['16:9','3:2','4:3'])}${field(`images.${i}.position`,'Punto de interés','','select',[['center','Centro'],['left','Izquierda'],['right','Derecha'],['top','Arriba']])}</div></section>`).join('')}</div><div class="callout"><p><strong>Entrega técnica:</strong> el laboratorio reduce las copias a un máximo de 1200 px para guardar y exportar. Conserva los originales. Para la web: WebP/AVIF, tamaños responsivos, dimensiones declaradas; hero prioritario y productos con carga diferida. No se descarga ni se publica tu selección en un servidor.</p></div>${markStep(4)}`}

function writing(){return `${sectionHead(6,'Escribe como hablaría el obrador.','Redacta mensajes cortos, útiles y amables. Explica qué pasa y cuál es el siguiente paso, especialmente cuando algo falla.')}<div class="callout"><p>«Hablamos de tú, sin culpar a nadie». Evita «Error 422» o «Has introducido mal el correo». Mejor: «Revisa el correo: necesitamos una dirección como nombre@dominio.es».</p></div><section class="panel">${field('writing.voice','Voz y tono','Define tratamiento, formalidad y términos que usarás de forma consistente.','textarea')}<div class="grid">${field('writing.hero','Titular del hero','Ej.: Pan artesano, del obrador a tu mesa.')}${field('writing.cta','Acción principal','Ej.: Elegir mi pan. El botón lleva al catálogo.')}${field('writing.add','Botón de compra de producto','Ej.: Añadir a la cesta.')}${field('writing.success','Producto añadido','Ej.: Pan añadido. Puedes seguir eligiendo o ver tu cesta.')}${field('writing.error','Error de correo en contacto','Indica cómo corregirlo, sin culpabilizar.','textarea')}${field('writing.empty','Cesta vacía','Da contexto y una salida para continuar.','textarea')}${field('writing.order','Confirmación del pedido de muestra','Indica que el pedido está confirmado y cuál es el siguiente paso; no inventes un cobro.','textarea')}${field('writing.contact','Confirmación del mensaje de contacto','Agradece e indica un plazo realista del caso ficticio.','textarea')}${field('writing.avoid','Qué evitamos y alternativa correcta','Un ejemplo de «no usar / usar» para mantener el tono.','textarea')}</div><p class="small">Para acciones de compra, diferencia «Añadir a la cesta» de «Confirmar pedido». El precio total y la franja de recogida se revisan antes de confirmar.</p></section>${writingPractice()}${previewBlock()}${markStep(6)}`}

function components(){return `${sectionHead(7,'Construye una familia de componentes.','Compara variantes ya adaptadas a tu paleta. Elige por coherencia y facilidad de compra, no solo por decoración.')}<div class="ui-demo" style="${vars()}">${Object.entries(optionSets).map(([k,opts],i)=>`<section class="panel"><h2>${i+1}. ${['Botones','Tarjetas de producto','Campos de formulario','Resumen de pedido'][i]}</h2><div class="ui-options">${opts.map(([v,label,desc])=>`<label class="ui-option"><input type="radio" name="ui-${k}" data-path="ui.${k}" value="${v}" ${state.ui[k]===v?'checked':''}> <strong>${label}</strong><div class="mini" style="${vars()}">${mini(k,v)}</div><small>${desc}</small></label>`).join('')}</div></section>`).join('')}</div><section class="panel"><div class="grid">${field('ui.spacing','Unidad de espaciado','','select',[[4,'4 px · escala 4, 8, 12, 16, 24'],[8,'8 px · escala 8, 16, 24, 32, 48'],[12,'12 px · escala 12, 24, 36, 48, 72']])}${field('ui.owner','Responsable y revisión','Ej.: Elena valida; equipo de diseño mantiene; revisar cada trimestre.')}</div>${field('ui.reason','Justifica tus componentes','Relaciona tus elecciones con la facilidad de compra y las personas que usarán la web.','textarea')}${field('ui.changelog','Historial de esta versión','','textarea')}</section><section class="panel"><h2>Los seis estados no son opcionales</h2><p>Estas muestras documentan el botón de compra. El foco conserva un contorno visible; la carga y los errores tienen texto.</p><div id="state-examples"></div><p class="small" style="margin-top:14px">Un diálogo de pedido debe recibir el foco al abrirse, contenerlo hasta cerrar, admitir Escape y devolverlo al botón de origen. El patrón seleccionado se documenta aquí; no se implementa un checkout real.</p></section>${atomicPractice()}${statePractice()}${previewBlock()}${markStep(7)}`}
function mini(k,v){let c=state.color;if(k==='button')return `<span style="background:${c.primary};color:${onColor(c.primary)};padding:10px 16px;border-radius:${{suave:10,recto:2,pill:99}[v]}px">Añadir pan</span>`;if(k==='card')return `<span style="padding:10px;background:${c.surface};color:${c.text};border:${v==='borde'?'1px solid '+c.text:'none'};box-shadow:${v==='sombra'?'0 3px 10px #0002':'none'};border-bottom:${v==='plana'?'2px solid '+c.secondary:''};border-radius:6px;font-size:13px">▧ &nbsp; Hogaza · 3,80 €</span>`;if(k==='field')return `<span style="width:80%;font-size:12px;color:${c.text}">Correo electrónico<span style="display:block;background:${v==='relleno'?c.secondary:c.surface};border:${v==='borde'?'1px solid '+c.text:'0'};border-bottom:1px solid ${c.text};height:25px"></span></span>`;return `<span style="width:90%;height:64px;border:1px solid #b5bbc5;display:flex;align-items:${v==='inferior'?'end':'center'};justify-content:${v==='lateral'?'end':'center'};background:#e1e3e6"><span style="display:block;background:${c.surface};color:${c.text};border:1px solid ${c.primary};width:${v==='inferior'?'100%':'65%'};padding:8px;font-size:11px">Tu pedido · 3,80 €</span></span>`;}
function stateExamples(){const c=state.color;return `<div class="state-grid ui-demo" style="${vars()}">${[['Default',''],['Hover',`background:${mix(c.primary,.14)};color:${onColor(mix(c.primary,.14))}`],['Focus',`outline:3px solid ${c.text};outline-offset:3px;border:2px solid ${c.surface}`],['Active',`background:${mix(c.primary,.25)};color:${onColor(mix(c.primary,.25))}`],['Disabled','background:#e2e5e9;color:#525b68;border-color:#bbc3cf'],['Loading','']].map(([l,st])=>`<div class="state-card"><strong>${l}</strong><span class="buy" style="display:inline-block;padding:10px 12px;${st}">${l==='Loading'?'Añadiendo…':esc(state.writing.add||'Añadir pan')}</span></div>`).join('')}</div>`}
function position(v){return {left:'left center',right:'right center',top:'center top',center:'center'}[v]||'center'}
function photo(i){let a=state.images[i];return a.data?`<img src="${a.data}" alt="${esc(a.alt)}" style="object-position:${position(a.position)}">`:`<span>${i?'Fotografía de producto':'Fotografía del obrador'}</span>`}
function shopHTML(){let w=state.writing,c=state.color;return `<div class="shop ${previewDevice==='mobile'?'mobile':''}" style="${vars()}"><header>${logoMark()}<nav aria-label="Páginas de la maqueta"><button data-preview-page="landing">Inicio / tienda</button><button data-preview-page="contacto">Contacto</button></nav></header><div class="shop-body">${previewPage==='landing'?`<div class="hero"><div><p class="eyebrow" style="color:${c.primary}">Tradición · Masa madre · Barrio</p><h2 style="font-size:${previewDevice==='mobile'?state.type.sizes.h1[0]:state.type.sizes.h1[1]}px;font-weight:${state.type.sizes.h1[2]}">${esc(w.hero||'Pan de barrio, hecho con tiempo.')}</h2><p style="font-size:${state.type.sizes.body[previewDevice==='mobile'?0:1]}px;line-height:${state.type.line}">Fermentación lenta, corteza crujiente y recogida en tu panadería de siempre.</p><button class="buy" data-shop="catalog">${esc(w.cta||'Elegir mi pan')}</button></div><div class="image" style="aspect-ratio:${state.images[0].crop.replace(':','/')}">${photo(0)}</div></div><div class="section-head"><h3>Nuestros panes de cada día</h3><div><button data-slide="-1" aria-label="Productos anteriores">←</button> <button data-slide="1" aria-label="Productos siguientes">→</button></div></div><div class="products" tabindex="0" aria-label="Carrusel de productos; desplaza para ver más">${['Hogaza de masa madre','Barra rústica','Pan de semillas'].map((n,i)=>`<article class="product" style="${state.ui.card==='sombra'?'box-shadow:0 4px 12px #0002':state.ui.card==='plana'?'border:0;border-bottom:2px solid '+c.secondary:''}"><div class="image" style="aspect-ratio:${state.images[i+1].crop.replace(':','/')}">${photo(i+1)}</div><h3>${n}</h3><p>${['500 g · 3,80 €','250 g · 1,40 €','450 g · 3,50 €'][i]}</p><p>Contiene gluten${i===2?' y sésamo':''}.</p><button class="buy" data-shop="add">${esc(w.add||'Añadir a la cesta')}</button></article>`).join('')}</div><p class="small" id="shop-feedback" role="status" style="color:${c.text};margin-top:12px">Maqueta de diseño · precios ficticios · no se realizan compras.</p>`:`<h2>Hablemos de pan</h2><div class="contact-grid"><div><p>Plaza del Trigo, 8<br>Lunes a sábado · 7:30–14:30<br>900 000 000<br>hola@migasamigas.example</p><div class="image" style="aspect-ratio:16/9">Plano de ubicación · referencia</div><p class="small" style="margin-top:10px">Todos los datos son ficticios.</p></div><div><label>Nombre (obligatorio)<input required aria-label="Nombre de ejemplo" placeholder="Tu nombre" style="${fieldStyle()}"></label><label>Correo (obligatorio)<input type="email" required aria-label="Correo de ejemplo" aria-describedby="shop-feedback" placeholder="nombre@dominio.es" style="${fieldStyle()}"></label><label>Mensaje (obligatorio)<textarea required aria-label="Mensaje de ejemplo" rows="3" style="${fieldStyle()}"></textarea></label><p class="small" style="color:${c.text}">Usaremos estos datos para responder a tu consulta. En producción: enlazar información de privacidad.</p><button class="buy" data-shop="contact">Enviar mensaje</button><p id="shop-feedback" role="status" class="small" style="color:${c.text};margin-top:10px">Formulario de muestra. No se envían datos.</p></div></div>`}</div><footer>Pan artesano · Recogida en tienda · Contacto · Privacidad</footer></div>`;}
function fieldStyle(){return state.ui.field==='relleno'?`background:${state.color.secondary};border:0;border-bottom:2px solid ${state.color.text}`:state.ui.field==='linea'?`border:0;border-bottom:2px solid ${state.color.text};border-radius:0`:''}

function refreshVisuals(){if($('#logo-preview'))$('#logo-preview').innerHTML=logoMark();if($('#shop-preview'))$('#shop-preview').innerHTML=shopHTML();if($('#state-examples'))$('#state-examples').innerHTML=stateExamples();if($('#icon-hints'))$('#icon-hints').textContent=(iconSuggestions[state.icons.family]||iconSuggestions['Font Awesome Free']).join(' · ');if($('#harmony-swatches')){renderGuideWheel();$('#harmony-swatches').innerHTML=harmony().map(x=>`<div class="swatch"><i style="background:${x}"></i><small>${x}</small></div>`).join('');for(const k of ['hue','sat','light'])$('#out-'+k).textContent=state.color[k];$('#contrast').innerHTML=contrastHTML();$('#proportions').innerHTML=[['background',60],['secondary',30],['primary',10]].map(([k,n])=>`<span style="width:${n}%;background:${state.color[k]};color:${onColor(state.color[k])}">${n}%</span>`).join('');$('#color-demo').innerHTML=`<div style="background:${state.color.background};color:${state.color.text};padding:22px;border-radius:9px"><h3>Hecho con tiempo.</h3><p>Tu pan listo para recoger.</p><span style="display:inline-block;padding:10px 16px;background:${state.color.primary};color:${onColor(state.color.primary)};border-radius:8px">Elegir mi pan</span></div>`;}

function markStep(n){return `<div class="panel tint"><h3>Antes de seguir</h3><p class="small">Comprueba los datos y registra las pruebas del reto. La validación didáctica se realiza al final con evidencias. Puedes volver a modificarlas; los cambios reabren la revisión de este paso.</p><button class="primary" data-check="${n}">${state.reviewed[n-1]?'✓ Paso comprobado':'Comprobar este paso'}</button><div id="step-errors" role="status" style="margin-top:12px"></div></div>`}
function valid(n){let e=[],need=(v,t)=>{if(!String(v??'').trim())e.push(t)};if(n===1){for(const k of ['mission','vision','audience','evidence','logoNote'])need(state.identity[k],{mission:'Completa la misión.',vision:'Completa la visión.',audience:'Define el público.',evidence:'Relaciona una decisión con la entrevista.',logoNote:'Explica la adaptación del imagotipo.'}[k]);if(state.identity.values.length<3)e.push('Elige al menos tres valores.');if(state.identity.slogan.length>48)e.push('Reduce el lema a 48 caracteres.');}
if(n===2){need(state.color.reason,'Justifica la paleta.');contrastRows().forEach(([name,a,b])=>{if(ratio(a,b)<4.5)e.push(`${name}: ajusta la combinación hasta 4,5:1.`)});}
if(n===3){need(state.type.reason,'Justifica las familias y la escala.');for(const [k,v] of Object.entries(state.type.sizes)){if(v[0]<12||v[1]<12||v[0]>80||v[1]>80)e.push(`${k}: usa tamaños de 12 a 80 px.`);if(v[1]<v[0])e.push(`${k}: el tamaño de escritorio debe ser igual o mayor que el móvil.`);}if(state.type.sizes.body[0]<16||state.type.sizes.button[0]<16)e.push('Usa al menos 16 px para lectura y botones en este proyecto.');for(let i=1;i<6;i++)if(state.type.sizes['h'+i][0]<state.type.sizes['h'+(i+1)][0]||state.type.sizes['h'+i][1]<state.type.sizes['h'+(i+1)][1])e.push('Mantén una escala de títulos descendente de H1 a H6.');}
if(n===4){need(state.imageRule,'Describe el estilo fotográfico.');state.images.forEach((x,i)=>{if(!x.data)e.push(`Falta la imagen ${i+1}.`);for(const k of ['author','source','license','proof','alt'])need(x[k],`Imagen ${i+1}: falta ${ {author:'autor',source:'procedencia',license:'licencia',proof:'condiciones de uso',alt:'texto alternativo'}[k]}.`);});}
if(n===5){for(const k of ['license','source','rule'])need(state.icons[k],'Completa '+{license:'la licencia de los iconos.',source:'la URL del catálogo.',rule:'las reglas de iconografía.'}[k]);state.icons.items.forEach((x,i)=>need(x,'Selecciona el icono de '+iconUses[i]+'.'));if(state.icons.size<16||state.icons.size>32)e.push('Elige un tamaño base de icono entre 16 y 32 px.');}
if(n===6)Object.entries(state.writing).forEach(([k,v])=>need(v,'Completa '+{voice:'la voz',hero:'el titular',cta:'la acción principal',add:'el botón de compra',success:'el mensaje de añadido',error:'el error de correo',empty:'la cesta vacía',contact:'la confirmación de contacto',order:'la confirmación del pedido',avoid:'el ejemplo de texto a evitar'}[k]+'.'));
if(n===7){need(state.ui.reason,'Justifica la elección de componentes.');need(state.ui.owner,'Asigna responsable y frecuencia de revisión.');need(state.ui.changelog,'Registra los cambios de esta versión.');}
return e.concat(learningErrors(n));}
function review(){return `${sectionHead(8,'De decisiones a una guía compartida.','Comprueba los siete pasos. El documento empieza por tus decisiones, pruebas y normas. La entrevista y los wireframes proporcionados se incluyen en los anexos.')}<section class="panel"><div class="grid">${field('student','Alumno o equipo')}${field('group','Grupo (opcional)')}${field('version','Versión de la guía')}${field('date','Fecha','','date')}</div>${names.slice(1,8).map((n,i)=>{let errors=valid(i+1);return `<div class="review-item"><div><strong>${i+1}. ${n}</strong><p class="${errors.length?'error':state.reviewed[i]?'ok':''}">${errors.length?errors.length+' datos por completar':state.reviewed[i]?'✓ Comprobado':'Completo · pendiente de comprobar'}</p></div><button data-go="${i+1}">Revisar</button></div>`}).join('')}<div class="callout"><p><strong>Exportación a PDF:</strong> pulsa «Generar guía» para verla y después «Guardar PDF». Se abrirá el diálogo de impresión: elige <strong>Guardar como PDF</strong>, A4, escala 100 %, sin cabeceras/pies del navegador y con gráficos de fondo. En móvil, usa la opción de guardar o compartir PDF del sistema.</p></div><div class="actions"><button class="primary" id="generate">Generar guía completa</button><button id="draft">Ver borrador</button></div><div id="review-errors" role="status" class="bad-list"></div><p class="small" style="margin-top:18px">Se exportan tus decisiones actuales, no una solución predeterminada. Las licencias y la adecuación real de las imágenes requieren revisión humana.</p></section>`}

out+=sheet('2 · Paleta y contraste',`<p>${esc(c.reason)}</p><div class="swatches">${colorKeys.map((k,i)=>`<div class="swatch"><i style="background:${c[k]}"></i><small>${esc(colorLabels[i].split(' · ')[0])}<br>${c[k]}</small></div>`).join('')}</div><h3>Aplicación</h3><p>Primario: acciones principales, marca y enlaces. Secundario: bloques decorativos. Fondo dominante y superficies tranquilas; texto para lectura. Estados: éxito, error, aviso e información acompañados de texto o icono. La proporción 60–30–10 es orientativa.</p><table><thead><tr><th>Combinación</th><th>Ratio calculado</th><th>Texto normal AA</th></tr></thead><tbody>${contrastRows().map(([name,a,b])=>`<tr><td>${name}<br><small>${a} / ${b}</small></td><td>${ratio(a,b).toFixed(2)}:1</td><td>${ratio(a,b)>=4.5?'Cumple 4,5:1':'Revisar'}</td></tr>`).join('')}</tbody></table><p class="small">Ratios WCAG calculados sobre colores sólidos. En fotografías, transparencias y estados derivados, comprobar la composición final. Las muestras hover y active usan un primario más oscuro con texto blanco o negro recalculado.</p>`);
out+=sheet('3 · Sistema tipográfico',`<p>${esc(t.reason)}</p>${rows([['Títulos',t.heading+'; reserva '+(['Lora','Playfair Display','Georgia'].includes(t.heading)?'serif':'sans-serif')],['Lectura y controles',t.body+'; reserva '+(['Lora','Playfair Display','Georgia'].includes(t.body)?'serif':'sans-serif')],['Interlineado','Títulos 1,15–1,2; lectura '+t.line+'; longitud de línea 45–75 caracteres.']])}<table><thead><tr><th>Uso</th><th>Móvil px / rem</th><th>Escritorio px / rem</th><th>Peso</th></tr></thead><tbody>${Object.entries(t.sizes).map(([k,v])=>`<tr><th>${k.toUpperCase()}</th><td>${v[0]} / ${(v[0]/16).toFixed(2)}</td><td>${v[1]} / ${(v[1]/16).toFixed(2)}</td><td>${v[2]}</td></tr>`).join('')}</tbody></table><p class="small">Conversión rem con base de 16 px. Tamaños de escritorio a partir de 900 px. Mantener jerarquía semántica H1–H6 y permitir zoom; no fijar alturas que corten texto.</p><div class="type-sample" style="margin-top:16px"><p style="font-family:${fontStack(t.heading)};font-size:${t.sizes.h1[0]}px;font-weight:${t.sizes.h1[2]};line-height:1.15">Pan que sabe a barrio.</p><p style="font-family:${fontStack(t.body)};font-size:${t.sizes.body[0]}px;line-height:${t.line}">Elige tu pan y recógelo en tu panadería de siempre.</p></div><p class="small">Fuentes web: Google Fonts; verificar la licencia de cada familia. La exportación usa la fuente cargada o su reserva si no hay conexión.</p>`);
out+=sheet('4 · Dirección de imágenes',`<p>${esc(state.imageRule)}</p><p>Objetivo: representar pan real con un tratamiento coherente. Las fotos de banco son referencias para este caso ficticio; no atribuirlas al obrador como si fueran propias.</p><h3>Preparación para la web</h3><p>Conservar originales. Producir variantes WebP/AVIF responsivas con dimensiones declaradas. Hero prioritario; carga diferida para productos fuera de pantalla. Revisar recorte, texto alternativo y peso por separado de la calidad visual. Copias del informe limitadas a 1200 px.</p>${imgSpec(0)}`);

out+=sheet('5 · Iconografía',`${rows([['Familia',state.icons.family],['Estilo',state.icons.style],['Tamaño',state.icons.size+' px; área pulsable del proyecto: al menos 44 × 44 px'],['Licencia / atribución',state.icons.license],['Normas de uso',state.icons.rule]])}<p>Catálogo: ${sourceLink(state.icons.source)}</p><table><thead><tr><th>Uso</th><th>Selección del alumno</th></tr></thead><tbody>${iconUses.map((u,i)=>`<tr><th>${u}</th><td>${iconProof(i,true)}</td></tr>`).join('')}</tbody></table><h3>Accesibilidad y coherencia</h3><p>Una misma familia, rejilla y tratamiento de trazo. No depender solo del color para comunicar estados. Acompañar las acciones de texto; iconos decorativos ocultos a tecnologías de asistencia y botones con nombre accesible.</p><p class="small">Este paso registra una selección para su integración posterior. Las referencias visuales elegidas se incluyen en este PDF para su revisión; la biblioteca todavía no se integra en la maqueta.</p>`);
out+=sheet('6 · UX writing',`${rows([['Voz y tono',w.voice],['Titular del hero',w.hero],['Acción principal',w.cta],['Compra de producto',w.add],['Confirmación de añadido',w.success],['Error de correo',w.error],['Cesta vacía',w.empty],['Mensaje de contacto',w.contact],['Pedido confirmado',w.order],['No usar / usar',w.avoid]])}<h3>Reglas transversales</h3><p>Usar los mismos nombres en navegación, botones y mensajes. Verbo de acción y consecuencia explícita. Diferenciar añadir a la cesta de confirmar un pedido. Indicar total y franja de recogida antes de confirmar; mantener los datos al corregir errores.</p>`);
out+=sheet('7 · Componentes seleccionados',`<p>${esc(state.ui.reason)}</p><div class="grid ui-demo" style="${vars()}">${Object.keys(optionSets).map((k,i)=>`<div class="panel"><h3>${['Botón','Tarjeta','Campo','Resumen de pedido'][i]}</h3>${mini(k,state.ui[k])}<p style="margin-top:12px">${esc(optionSets[k].find(o=>o[0]===state.ui[k])?.[1]||'Pendiente')}</p></div>`).join('')}</div>${rows([['Botón','Etiqueta de acción, relleno primario, texto '+onColor(c.primary)+', radio '+radius()+' px y área mínima de 44 px.'],['Tarjeta','Imagen, nombre del pan, peso, precio, ingredientes/alérgenos y acción de compra. En móvil, carrusel manual; tres tarjetas en escritorio.'],['Campo','Etiqueta permanente, ayuda, entrada y mensaje de error. Tipografía legible; teclado adecuado para correo.'],['Diálogo','Título, resumen, total, confirmar y cancelar/cerrar. Foco inicial, Escape, contención del foco y restauración al cerrar.'],['Espaciado','Unidad de '+state.ui.spacing+' px; múltiplos coherentes en márgenes, rellenos y separación.']])}`);

let oldD=previewDevice,oldP=previewPage;previewDevice='desktop';previewPage='landing';out+=sheet('Aplicación · Landing / tienda',shopHTML());previewPage='contacto';out+=sheet('Aplicación · Contacto',shopHTML());previewDevice=oldD;previewPage=oldP;
out+=sheet('Tokens y mantenimiento',`<pre>${esc(token)}</pre>${rows([['Responsable y revisión',state.ui.owner],['Versión / fecha',state.version+' · '+state.date],['Historial de cambios',state.ui.changelog]])}<h3>Cómo mantener la guía</h3><p>Proponer el cambio, comprobar contraste y lectura en móvil, probar teclado y estados, validar con Elena y actualizar versión, fecha e historial. Mantener la guía y los componentes sincronizados.</p><h3>Usos correctos / incorrectos</h3><p>Sí: fotos coherentes y con permiso, compra visible, etiquetas permanentes, un solo lenguaje de iconos. No: deformar el imagotipo, esconder el precio, reemplazar etiquetas por placeholders, eliminar el foco o usar color como única señal.</p><p class="small">Recursos: ${link('https://fonts.google.com/','Google Fonts')} · ${link('https://fontawesome.com/license/free','Licencia Font Awesome')} · ${link('https://unsplash.com/license','Licencia Unsplash')} · ${link('https://www.pexels.com/license/','Licencia Pexels')} · ${link('https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html','Contraste WCAG')}.</p>`);
out+=sheet('Anexo · Entrevista proporcionada',`<p>Elena y Tomás, responsables de la panadería. Escenario ficticio utilizado como base de las decisiones del alumno.</p>${interviewHTML()}`);
out+=sheet('Anexo · Mapa de navegación',`<p>Menú común: Inicio / tienda, Contacto y Cesta. El hero y el catálogo se encuentran en la misma landing; el contacto dispone de una página propia.</p><div class="navigation-map">${navigationSVG(false)}</div><h3>Compra sencilla</h3><p>Elegir pan → revisar productos, cantidades y total → seleccionar franja de recogida → confirmar el pedido. No se exige crear una cuenta. Antes de confirmar se puede volver a la cesta y corregir cantidades.</p><p>La cesta y los pasos de compra son la estructura prevista para la futura tienda. Los cuatro wireframes del laboratorio desarrollan la landing y la página de contacto, en móvil y escritorio.</p><h3>Navegación compartida</h3><p>Conservar los mismos nombres de menú en todas las pantallas. El pie ofrece contacto, privacidad e información de ingredientes y alérgenos. Este mapa de navegación orienta a las personas; no sustituye a sitemap.xml.</p>`);

async function loadImage(file,logo=false){if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Elige una imagen PNG, JPG o WebP.');if(file.size>15*1024*1024)throw Error('Reduce la imagen a menos de 15 MB antes de cargarla.');let url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();if(im.naturalWidth*im.naturalHeight>40000000)throw Error('Reduce las dimensiones de la imagen antes de cargarla.');const scale=Math.min(1,(logo?800:1200)/Math.max(im.naturalWidth,im.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(im.naturalWidth*scale);canvas.height=Math.round(im.naturalHeight*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let data=canvas.toDataURL(logo?'image/png':'image/jpeg',.78);if(data.length>1600000)throw Error('La copia sigue siendo demasiado grande. Optimiza el archivo y vuelve a intentarlo.');return {data,name:file.name,width:im.naturalWidth,height:im.naturalHeight,kb:Math.ceil(data.length*.75/1024),originalKb:Math.ceil(file.size/1024)};}finally{URL.revokeObjectURL(url)}}

 if(n===0)return `<section class="panel learning-route"><h2>Primera fase del proyecto Migas Amigas</h2><p>Diseñamos la guía y dos pantallas: <strong>inicio con catálogo integrado y contacto</strong>. El caso completo del tema ampliará esta base a inicio, catálogo, ficha de producto, nosotros y encargo. Los requisitos de hostelería, pedidos recurrentes y antelación de 24 horas se trabajarán en esa ampliación.</p><p>Recorrido: <strong>empatizar</strong> con la entrevista → <strong>definir</strong> requisitos → <strong>idear</strong> alternativas → <strong>prototipar</strong> la guía → <strong>testar</strong> con otra persona y mejorar.</p>${link('../ciclos/diw/u01_es.html#sec10','Ver el caso completo del tema')}<p class="small">Los siete pasos mantienen el orden del apartado 6.2. Las opciones iniciales son puntos de partida: justifica qué conservas y qué cambias.</p></section>`;

 if(n===2)return `<div class="learning-example"><strong>Ejemplo:</strong> primario = marca y compra; error = indicar qué corregir, acompañado de texto. No cambies el significado de los estados por motivos decorativos.</div><p>Reto: este enlace sobre blanco empieza con poco contraste. Oscurece el texto hasta alcanzar 4,5:1 para texto normal. El ejercicio no modifica tu paleta.</p><label class="field">Color del enlace de prueba<input type="color" data-path="learning.challengeColor" value="${state.learning.challengeColor}"></label><div id="contrast-challenge" aria-live="polite"></div>${field('learning.colorLesson','¿Qué cambiaste y cómo lo aplicarás a tu paleta?','','textarea')}<p><strong>Marca:</strong> primario y secundario. <strong>Neutros:</strong> fondo, superficie y texto. <strong>Estados:</strong> éxito, error, aviso e información. Puedes empezar por marca y neutros; abre después las opciones de estados.</p>`;
 if(n===3)return `<div class="learning-example"><strong>Ejemplo:</strong> cuerpo de 16 px y razón 1,20 producen una escala progresiva. Es un punto de partida del proyecto, no una regla universal. Un título no debe crecer tanto que oculte la compra.</div><div class="grid">${field('learning.typeBase','Tamaño base','','select',[[16,'16 px'],[18,'18 px'],[20,'20 px']])}${field('learning.typeRatio','Razón de la escala','','select',[[1.125,'Suave · 1,125'],[1.2,'Equilibrada · 1,20'],[1.25,'Marcada · 1,25']])}</div><button id="apply-type-scale">Aplicar escala inicial</button><p class="small">Sustituye los tamaños actuales. Después puedes ajustar cada nivel y peso.</p>`;
 if(n===4)return `<div class="learning-example"><h3>Ficha resuelta · ejemplo ficticio</h3><p><strong>Imagen:</strong> manos dando forma a una hogaza. <strong>Autor:</strong> equipo del obrador. <strong>Procedencia:</strong> archivo propio, sesión del proyecto. <strong>Permiso:</strong> fotografía propia con autorización de uso de las personas reconocibles. <strong>Atribución:</strong> Foto: Migas Amigas. <strong>Alt:</strong> Manos dando forma a una hogaza de masa madre. <strong>Recorte:</strong> 16:9, manos en el centro, sin cortar el pan.</p><p>Es una ficha de ejemplo, no una licencia para tus archivos. Documenta las condiciones de cada recurso que selecciones.</p></div><p>Compara la imagen completa con el recorte. El peso original y el de la copia reducida se muestran por separado; comprueba que la reducción conserva textura y detalle.</p>`;

function atomicPractice(){return `<section class="panel"><h2>Del sistema a la tarjeta</h2><div class="grid">${field('learning.atom','Un átomo de tu tarjeta')}${field('learning.molecule','Una agrupación de átomos (molécula)')}${field('learning.organism','Un organismo de tu landing','Indica qué contiene y justifica el nivel elegido.')}${field('learning.principle','Principio aplicado','','select',['Proximidad','Jerarquía visual','Consistencia','Ley de Hick','Ley de Fitts'])}</div>${field('learning.principleReason','Compara dos variantes y justifica tu elección','Ej.: agrupo precio y botón por proximidad para que se entienda qué se compra.','textarea')}<h3>Un token, varias aplicaciones</h3><label class="field">Color primario compartido<input type="color" data-path="color.primary" value="${state.color.primary}"></label><div id="token-demo"></div>${field('learning.tokenObservation','¿Qué cambia al editar el token?','Relaciona el valor primitivo, su función semántica y el componente.','textarea')}</section>`;}
function tokenDemo(){return `<div class="learning-example"><code>Primitivo ${state.color.primary} → --color-primary → --button-primary-bg</code></div><div class="practice-zone ui-demo" style="${vars()}"><button class="buy" data-token-demo>Comprar pan</button> <a href="#content" style="color:${state.color.primary}">Consultar catálogo</a><div style="border:2px solid ${state.color.primary};padding:16px;margin-top:15px">Tarjeta destacada: la misma decisión compartida.</div></div><p class="small">Modificar el primario aquí reabre también la comprobación del paso Color.</p>`;}
function statePractice(){return `<section class="panel"><h2>Laboratorio de estados</h2><p>Usa el ratón y después Tab, Enter y Escape. Observa default, hover, focus, active, disabled y loading. Las acciones son simulaciones.</p><div class="practice-zone ui-demo" style="${vars()}"><div class="actions"><button id="sandbox-add" class="buy">${esc(state.writing.add||'Añadir a la cesta')}</button><button class="buy" disabled aria-describedby="disabled-reason">Pan agotado</button><button id="open-practice-dialog">Ver resumen de muestra</button></div><p id="disabled-reason">El segundo botón está desactivado porque no queda stock.</p><p id="sandbox-feedback" role="status">Prueba el primer botón para ver la carga.</p><label>Correo de prueba<input id="sandbox-email" type="email" placeholder="nombre@dominio.es" aria-describedby="sandbox-error" style="${fieldStyle()}"></label><p id="sandbox-error" role="status"></p><button id="sandbox-validate">Comprobar correo de muestra</button></div><dialog id="practice-dialog" class="practice-dialog" data-placement="${state.ui.modal}" style="${vars()}" aria-labelledby="practice-dialog-title"><h2 id="practice-dialog-title">Tu pedido de muestra</h2><p>Hogaza · 3,80 € · Recogida en tienda</p><p>Simulación: no se cobra ni se registra ningún pedido.</p><button id="confirm-practice-dialog">Confirmar simulación</button> <button id="close-practice-dialog" autofocus>Volver</button></dialog>${field('learning.stateTest','Resultado de la prueba de estados','Explica cómo localizas el foco, qué ocurre durante la carga y cómo corriges el error.','textarea')}</section>`;}
function peerReview(){return `<section class="panel learning-route"><h2>Testar, mejorar y validar</h2><p><strong>Completo</strong> significa que has aportado los datos requeridos. <strong>Comprobado</strong> indica que pasan las comprobaciones del laboratorio. La <strong>validación didáctica</strong> requiere observar el uso y aportar evidencias; la rúbrica no pone una nota automática.</p><p>Entrega la maqueta a otra persona. No le expliques dónde pulsar. Registra lo que hace y lo que dice, sin datos personales: basta un alias o equipo.</p>${field('learning.peer.name','Alias de quien prueba')}${peerTasks.map((t,i)=>`<fieldset><legend>${i+1}. ${t}</legend>${field('learning.peer.tasks.'+i+'.result','Resultado','','select',[['','Selecciona'],['sin ayuda','Lo consigue sin ayuda'],['con ayuda','Lo consigue con ayuda'],['no completada','No logra completarla']])}${field('learning.peer.tasks.'+i+'.observation','Observación concreta','Ej.: buscó el horario en el pie antes de entrar en Contacto.','textarea')}</fieldset>`).join('')}<div class="grid">${field('learning.peer.problem','Problema o duda detectada','','textarea')}${field('learning.peer.change','Mejora aplicada','Vuelve al paso correspondiente y aplícala antes de validar.','textarea')}</div>${field('learning.peer.retest','Resultado tras repetir la prueba','Explica si la mejora resolvió el problema o qué queda pendiente.','textarea')}<h3>Rúbrica con evidencias</h3><p>En desarrollo: falta comprobar o corregir. Justificado: decisión coherente explicada. Contrastado: comprobada con evidencia y revisada tras la prueba.</p>${rubricCriteria.map(([title,desc],i)=>`<fieldset><legend>${title}</legend><p class="small">${desc}</p>${field('learning.rubric.'+i+'.level','Nivel alcanzado','','select',[['','Selecciona'],['En desarrollo','En desarrollo'],['Justificado','Justificado'],['Contrastado','Contrastado']])}${field('learning.rubric.'+i+'.evidence','Evidencia observable','Cita una decisión, pantalla, ratio o resultado de la prueba.','textarea')}</fieldset>`).join('')}<button id="validate-learning">Registrar validación didáctica</button><div id="learning-validation" role="status" class="learning-status">${state.learning.peer.confirmed?'Validación registrada con evidencias.':'Validación pendiente. Puedes generar un borrador en cualquier momento.'}</div><p class="small">Si modificas decisiones de diseño, tendrás que revisar las evidencias y registrar de nuevo la validación.</p></section>${previewBlock()}${statePractice()}`;}
function learningErrors(n){const l=state.learning,e=[],need=(v,msg)=>{if(!String(v||'').trim())e.push(msg);};
 if(n===1){l.requirements.forEach((r,i)=>Object.values(r).forEach(v=>need(v,`Completa frase, necesidad y decisión del requisito ${i+1}.`)));need(l.logoTest,'Registra las pruebas del imagotipo.');}
 if(n===2){if(ratio(l.challengeColor,'#ffffff')<4.5)e.push('Resuelve el reto del enlace sobre blanco (4,5:1).');need(l.colorLesson,'Explica lo aprendido en el reto de contraste.');}
 if(n===3)need(l.typeTest,'Registra la prueba de lectura móvil y escritorio.');
 if(n===5)l.iconPreviews.forEach((x,i)=>{if(!x.data)e.push('Añade la referencia visual del icono de '+iconUses[i]+'.');});
 if(n===6)need(l.writingTest,'Explica la comprobación de los mensajes en contexto.');
 if(n===7)for(const [k,label] of Object.entries({atom:'el átomo',molecule:'la molécula',organism:'el organismo',principleReason:'la comparación de variantes',tokenObservation:'la observación del token',stateTest:'la prueba de estados'}))need(l[k],'Completa '+label+'.');
 return [...new Set(e)];
}
function peerErrors(){const p=state.learning.peer,e=[];if(!p.name.trim())e.push('Indica un alias para la persona que prueba.');p.tasks.forEach((t,i)=>{if(!['sin ayuda','con ayuda','no completada'].includes(t.result)||!t.observation.trim())e.push('Registra resultado y observación de la tarea '+(i+1)+'.');});for(const k of ['problem','change','retest'])if(!p[k].trim())e.push('Completa problema, mejora y repetición de la prueba.');state.learning.rubric.forEach((r,i)=>{if(!['En desarrollo','Justificado','Contrastado'].includes(r.level)||!r.evidence.trim())e.push('Completa nivel y evidencia de '+rubricCriteria[i][0]+'.');});return [...new Set(e)];}
function refreshLearning(){
 if($('#logo-tests'))$('#logo-tests').innerHTML=logoProofHTML();
 if($('#contrast-challenge')){let c=state.learning.challengeColor,r=ratio(c,'#ffffff');$('#contrast-challenge').innerHTML=`<div class="learning-test" style="background:white"><span style="color:${c};text-decoration:underline">Consultar ingredientes del pan</span></div><p class="${r>=4.5?'ok':'error'}">${r.toFixed(2)}:1 · ${r>=4.5?'Reto resuelto: explica tu decisión.':'Aún cuesta leerlo: prueba un tono más oscuro.'}</p>`;}
 if($('#full-type-preview'))$('#full-type-preview').innerHTML=typeSpecHTML();
 if($('#writing-context'))$('#writing-context').innerHTML=writingContext();
 if($('#token-demo'))$('#token-demo').innerHTML=tokenDemo();
 $$('[data-image-comparison]').forEach(el=>el.innerHTML=imageComparison(Number(el.dataset.imageComparison)));
 if(active===7){$$('.practice-zone,.practice-dialog').forEach(el=>el.style.cssText=vars());if($('#practice-dialog'))$('#practice-dialog').dataset.placement=state.ui.modal;if($('#sandbox-email'))$('#sandbox-email').style.cssText=fieldStyle();}
}
function learningReport(){const l=state.learning,p=l.peer;let out=sheet('Decisiones propias · del encargo al diseño',`<p>Primera fase: landing con catálogo y contacto. La arquitectura completa de cinco páginas se desarrolla en el caso integrado del tema. Las siguientes decisiones corresponden al alumno; los materiales proporcionados figuran en los anexos.</p><table><thead><tr><th>Frase del cliente</th><th>Necesidad</th><th>Decisión</th></tr></thead><tbody>${l.requirements.map(r=>`<tr><td>${esc(r.quote)}</td><td>${esc(r.need)}</td><td>${esc(r.decision)}</td></tr>`).join('')}</tbody></table><h3>Relación con Atomic Design</h3>${rows([['Átomo',l.atom],['Molécula',l.molecule],['Organismo',l.organism],['Principio aplicado',l.principle+': '+l.principleReason],['Token compartido',l.tokenObservation]])}`);
 out+=sheet('Pruebas y decisiones revisadas',rows([['Imagotipo',l.logoTest],['Reto de color',ratio(l.challengeColor,'#ffffff').toFixed(2)+':1. '+l.colorLesson],['Lectura móvil y escritorio',l.typeTest],['Mensajes en contexto',l.writingTest],['Estados y teclado',l.stateTest]])+`<h3>Referencias visuales del imagotipo</h3>${logoProofHTML()}`);
 out+=sheet('Validación · prueba entre compañeros',`<p><strong>Persona que prueba:</strong> ${esc(p.name||'Pendiente')} · ${p.confirmed?'Validación registrada':'Validación pendiente'}</p>${peerTasks.map((t,i)=>`<div class="peer-task"><h3>${i+1}. ${t}</h3><p>${esc(p.tasks[i].result)} · ${esc(p.tasks[i].observation)}</p></div>`).join('')}${rows([['Problema observado',p.problem],['Mejora aplicada',p.change],['Segunda prueba',p.retest]])}`);
 out+=sheet('Autoevaluación con evidencias',`<p>Esta rúbrica documenta el razonamiento y las comprobaciones; no constituye una calificación automática.</p>${rubricCriteria.map(([title,desc],i)=>`<h3>${title} · ${esc(l.rubric[i].level||'Pendiente')}</h3><p>${desc}</p><p><strong>Evidencia:</strong> ${esc(l.rubric[i].evidence)}</p>`).join('')}`);return out;
}
document.addEventListener('keydown',e=>{const dialog=e.target.closest('#practice-dialog');if(!dialog||!dialog.open||e.key!=='Tab')return;const targets=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(x=>!x.hidden);const first=targets[0],last=targets.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.iconUpload!==undefined){try{const x=await loadImage(el.files[0],true);state.learning.iconPreviews[Number(el.dataset.iconUpload)].data=x.data;invalidate();save();render();notify('Referencia visual incorporada.');}catch(err){notify(err.message);el.value='';}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.iconRemove!==undefined){state.learning.iconPreviews[Number(b.dataset.iconRemove)].data='';invalidate();save();render();}
 if(b.id==='apply-type-scale'){const base=Number(state.learning.typeBase),r=Number(state.learning.typeRatio);for(let h=1;h<=6;h++){state.type.sizes['h'+h]=[Math.round(base*r**(6-h)),Math.round((base+2)*r**(6-h)),h<3?700:600];}state.type.sizes.body=[base,base+2,400];state.type.sizes.button=[base,base,600];state.type.sizes.caption=[Math.max(12,base-2),Math.max(12,base-2),400];invalidate();save();render();notify('Escala aplicada. Comprueba los dos tamaños de pantalla.');}
 if(b.dataset.writingScene){writingScene=b.dataset.writingScene;$$('[data-writing-scene]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.writingScene===writingScene));refreshLearning();}
 if(b.hasAttribute('data-writing-next')){const input=$('#writing-context input');if(input)input.focus();$('#writing-next-result').textContent='La acción llevaría a '+(writingScene==='empty'?'seleccionar un pan.':writingScene==='error'?'corregir el correo.':writingScene==='success'?'revisar la cesta.':'inicio.');}
 if(b.id==='sandbox-add'&&!sandboxBusy){sandboxBusy=true;b.disabled=true;b.setAttribute('aria-busy','true');b.textContent='Añadiendo…';$('#sandbox-feedback').textContent='Carga simulada: espera antes de repetir la acción.';setTimeout(()=>{sandboxBusy=false;if(!b.isConnected)return;b.disabled=false;b.removeAttribute('aria-busy');b.textContent=state.writing.add||'Añadir a la cesta';$('#sandbox-feedback').textContent=state.writing.success||'Pan añadido a la cesta de muestra.';},900);}
 if(b.id==='sandbox-validate'){const input=$('#sandbox-email'),ok=input.value.trim()&&input.validity.valid;input.setAttribute('aria-invalid',String(!ok));$('#sandbox-error').textContent=ok?'Correo válido en esta simulación. No se envían datos.':state.writing.error||'Revisa el correo: escribe una dirección como nombre@dominio.es.';$('#sandbox-error').style.color=ok?state.color.success:state.color.error;if(!ok)input.focus();}
 if(b.id==='open-practice-dialog')$('#practice-dialog').showModal();
 if(b.id==='close-practice-dialog'||b.id==='confirm-practice-dialog'){if(b.id==='confirm-practice-dialog')$('#sandbox-feedback').textContent=state.writing.order||'Pedido de muestra confirmado. No se ha realizado ningún cargo.';$('#practice-dialog').close();$('#open-practice-dialog').focus();}
 if(b.id==='validate-learning'){$('#report').innerHTML='';$('#report').className='report';const errors=peerErrors();state.learning.peer.confirmed=!errors.length;save();$('#learning-validation').innerHTML=errors.length?'<ul>'+errors.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'Validación didáctica registrada con evidencias. La revisión docente podrá contrastarlas.';}
 if(b.hasAttribute('data-token-demo'))notify('Este botón utiliza el mismo color primario que el enlace y el borde de la tarjeta.');
});

try{let raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);state=safeImport(parsed);state.learning.peer.confirmed=parsed.learning?.peer?.confirmed===true&&peerErrors().length===0;state.reviewed=initial.reviewed.map((_,i)=>parsed.reviewed?.[i]===true&&valid(i+1).length===0);}}catch(e){notify('No se pudo recuperar el guardado local. Puedes abrir una copia JSON.');}
active=state.step;render();

</script>
</body>
</html>
