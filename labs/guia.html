const interview=[
['¿Qué hace especial a Migas Amigas?','Somos Elena y Tomás. Nuestra familia lleva tres generaciones haciendo pan en el barrio. Trabajamos con masa madre, fermentaciones largas y harinas de un molino cercano. Preferimos explicar cómo hacemos el pan a presumir de ser los mejores.'],
['¿Para qué necesitáis la web?','Queremos vender online y que la gente pueda reservar el pan antes de salir de casa. La primera fase será recoger en tienda; más adelante estudiaremos reparto de proximidad. No vamos a prometer entregas que aún no podemos atender.'],
['¿Quién va a comprar?','Clientes del barrio, familias y personas que llegan desde el móvil camino del trabajo. También personas mayores que nos conocen de toda la vida. Queremos textos cómodos de leer y una compra sin tener que crear una cuenta.'],
['¿Cómo debe sentirse la marca?','Tradicional, cálida, honesta y cercana, como entrar en nuestro obrador. Artesana sin parecer antigua ni exclusiva. Nada de lujo frío, descuentos agresivos o frases complicadas.'],
['¿Qué debe verse primero?','El pan artesano, cómo se hace y un acceso claro a comprar. Empezamos con tres productos: hogaza de masa madre, barra rústica y pan de semillas. Cada tarjeta debe enseñar foto, nombre, peso, precio y acceso a ingredientes y alérgenos.'],
['¿Qué significa una compra sencilla?','Elegir pan, añadirlo a la cesta, escoger una franja de recogida y confirmar el pedido viendo el precio total. Siempre debemos poder cambiar cantidades y corregir errores. No pediremos datos que no necesitemos.'],
['¿Qué mantenemos del logotipo?','El nombre Migas Amigas tiene que seguir siendo reconocible. Queremos un símbolo de espiga o de pan que pueda usarse junto al nombre y también por separado. Debe leerse en el móvil, en una bolsa y en una etiqueta.'],
['¿Qué imágenes y mensajes usaremos?','Preferimos fotos de nuestras manos y del pan real con luz natural. Si usáis imágenes de ejemplo, deben tener permiso de uso y figurar como referencias, sin hacerlas pasar por fotos del negocio. Hablamos de tú, con amabilidad y sin culpar a nadie cuando hay un error.'],
['¿Qué necesita la página de contacto?','Dirección, horario, teléfono, cómo llegar y un formulario breve: nombre, correo y mensaje. Debe indicar qué campos son obligatorios y explicar el uso de los datos. Para el ejercicio, usad Plaza del Trigo, 8; lunes a sábado de 7:30 a 14:30; teléfono 900 000 000 y hola@migasamigas.example. Son datos ficticios.'],
['¿Cómo sabremos que el diseño funciona?','Si desde el móvil encontramos el pan y la forma de recogerlo sin ayuda. Necesitamos buen contraste, botones cómodos, navegación por teclado y mensajes claros. Elena revisará los cambios de la guía antes de publicarlos.']];

function brief(){return `${sectionHead(0,'Del obrador a la pantalla.','Convierte una conversación con el cliente en un sistema de diseño. Decide, comprueba y documenta: al final tendrás una guía de estilo en PDF con tus elecciones.')}<div class="hero-intro"><div class="panel"><p class="eyebrow">Proyecto de aula · caso ficticio</p><h2>Una panadería de barrio.<br>Una nueva forma de comprar.</h2><p>Primero conoce el encargo y la estructura de la web. Después trabajarás una decisión a la vez, con ejemplos editables y una maqueta que responde a tus elecciones.</p><div class="grid">${field('student','Nombre del alumno o equipo')}${field('group','Grupo (opcional)')}</div><p class="small">Tus imágenes y respuestas se procesan en este dispositivo. «Guardar trabajo» descarga una copia JSON para continuar en otro navegador. No introduzcas datos reales de clientes.</p></div><div class="brief-cover">${logoSVG()}<p>Pan de barrio, hecho con tiempo.</p><span class="brief-tag">ENTREVISTA → DECISIONES → GUÍA</span></div></div><details class="panel" open><summary><strong>La entrevista con Elena y Tomás</strong> · Léela antes de diseñar</summary><div style="margin-top:24px">${interviewHTML()}</div></details><section class="panel" id="navigation-map"><p class="eyebrow">La estructura de la web</p><h2>Un mapa de navegación sencillo</h2><p>Desde el menú se accede a <strong>Inicio / tienda</strong>, <strong>Contacto</strong> y <strong>Cesta</strong>. El catálogo forma parte de la landing; la compra continúa desde la cesta.</p>${navigationMapHTML()}<div class="actions" style="margin-top:16px"><button id="download-navigation">Descargar mapa SVG</button></div><p class="small" style="margin-top:14px">La cesta, la recogida y la confirmación representan el recorrido previsto para la futura tienda. Los wireframes de este laboratorio desarrollan la landing y el contacto. Este mapa describe la navegación de las personas, no un archivo sitemap.xml para buscadores.</p></section><section class="panel"><p class="eyebrow">Estructura antes que estilo</p><h2>Cuatro wireframes, un mismo recorrido</h2><p>Partimos de 375 px: una columna y una tarjeta de producto por desplazamiento. Desde 900 px, el hero y el contacto pasan a dos columnas; el carrusel muestra tres tarjetas. No avanza automáticamente.</p><div class="tabs" aria-label="Página del wireframe"><button data-wf-page="landing" aria-pressed="${wfPage==='landing'}">Landing / tienda</button><button data-wf-page="contacto" aria-pressed="${wfPage==='contacto'}">Contacto</button></div><div class="tabs" aria-label="Tamaño del wireframe"><button data-wf-device="mobile" aria-pressed="${wfDevice==='mobile'}">Móvil · 375 px</button><button data-wf-device="desktop" aria-pressed="${wfDevice==='desktop'}">Escritorio · 1200 px</button><button id="download-wire">Descargar este SVG</button></div><div class="wire">${wireSVG(wfPage,wfDevice)}</div><div class="callout"><strong>Contrato de la maqueta</strong><p>Hero + catálogo con compra + contacto. Los botones representan un flujo de compra; este laboratorio no tramita pedidos ni envía formularios. El PDF incluirá los cuatro wireframes.</p></div></section>`}

function identity(){return `${sectionHead(1,'Define quiénes somos.','Extrae la identidad de la entrevista. Cada decisión debe responder a algo que Elena y Tomás necesitan.')}<div class="callout"><strong>La pista del cliente</strong><p>«Artesana sin parecer antigua ni exclusiva», «compra sin cuenta», «pan del barrio». Usa estas evidencias para justificar tu propuesta.</p></div><div class="panel"><div class="grid">${field('identity.mission','Misión: ¿qué ofrecemos y para quién?','Por ejemplo: facilitar el acceso al pan artesano del barrio mediante una compra sencilla.','textarea')}${field('identity.vision','Visión: ¿hacia dónde queremos ir?','Piensa en la venta online y en mantener el trato cercano.','textarea')}${field('identity.audience','Público prioritario','Concreta quién compra, desde dónde y qué dificultad hay que evitar.','textarea')}${field('identity.personality','Personalidad de la marca','','select',['Cercana y artesanal','Tradicional y sencilla','Honesta y acogedora'])}</div><fieldset><legend>Valores · Elige al menos tres</legend><div class="choice-list">${['Tradición','Cercanía','Artesanía','Honestidad','Sostenibilidad'].map(v=>`<label class="chip"><input type="checkbox" data-value="${v}" ${state.identity.values.includes(v)?'checked':''}>${v}</label>`).join('')}</div></fieldset>${field('identity.evidence','Del encargo a una decisión','Cita una frase de la entrevista y explica qué cambiará en la interfaz gracias a ella.','textarea')}</div><section class="panel"><p class="eyebrow">Tu primera pieza de diseño</p><h2>Adapta el imagotipo</h2><p>Conservamos el nombre del laboratorio anterior. Esta nueva base vectorial añade un símbolo separable: nombre + símbolo forman un <strong>imagotipo</strong>. Modifica aquí su composición o descárgalo y edítalo fuera.</p><div class="grid"><div><div id="logo-preview" class="logo-stage"></div><div class="actions" style="margin:14px 0"><button id="download-logo">Descargar SVG editable</button></div><div class="resource-links">${link('https://editor.method.ac/','Method Draw')}${link('https://boxy-svg.com/app','Boxy SVG')}${link('https://penpot.app/','Penpot')}</div><p class="small">Abre el SVG en un editor, cambia proporciones, tipografía o trazos y guarda una copia. Para incorporarlo al informe, exporta PNG con fondo transparente. Comprueba las condiciones de la herramienta elegida.</p></div><div>${field('identity.motif','Símbolo','','select',[['espiga','Espiga'],['hogaza','Hogaza']])}${field('identity.layout','Composición','','select',[['horizontal','Horizontal'],['vertical','Vertical']])}${field('identity.slogan','Lema','Máximo visible: 48 caracteres. Se colorea con el primario del paso 2.')}<label class="field">Cargar tu adaptación (PNG, JPG o WebP)<input type="file" data-upload="logo" accept="image/png,image/jpeg,image/webp"></label>${state.identity.customLogo?'<button data-remove="logo">Usar de nuevo el SVG base</button>':''}</div></div>${field('identity.logoNote','¿Qué has adaptado y por qué?','Relaciona símbolo, proporciones y legibilidad con la entrevista.','textarea')}<div class="callout"><p><strong>Reglas de uso:</strong> mantén las proporciones y una zona libre equivalente a la altura de la M. Ancho mínimo propuesto: 160 px en horizontal, 120 px en vertical. Prueba también en una tinta. No estires, no añadas sombras ni coloques sobre fotografías con ruido. El PDF recogerá estas reglas.</p></div></section>${markStep(1)}`}

function rgb(hex){return hex.slice(1).match(/../g).map(x=>parseInt(x,16))}
function lum(hex){return rgb(hex).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
function ratio(a,b){let x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function onColor(c){return ratio(c,'#ffffff')>=ratio(c,'#000000')?'#ffffff':'#000000'}
function mix(hex,amount){return '#'+rgb(hex).map(v=>Math.round(v*(1-amount)).toString(16).padStart(2,'0')).join('')}
function hsl(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return '#'+[f(0),f(8),f(4)].map(v=>Math.round(255*v).toString(16).padStart(2,'0')).join('')}
const harmonyInfo={complementary:['Complementario','Dos colores opuestos en la rueda, separados 180°. Útil para diferenciar una acción; el contraste entre texto y fondo se comprueba por separado.'],analogous:['Análogos','Matices vecinos, a 30° a cada lado del color base. Comparten una dirección cromática y permiten una composición tranquila.'],triadic:['Triádico','Tres matices separados 120°. Da protagonismo a uno y reserva los demás para apoyos y acentos.'],monochromatic:['Monocromático','Un mismo matiz con distintos valores de luminosidad. Aporta unidad; usa el contraste para separar texto, fondo y controles.']};

function renderGuideWheel(){const c=state.color,info=harmonyInfo[c.harmony]||harmonyInfo.analogous;$('#harmony-title').textContent=info[0];$('#harmony-description').textContent=info[1];$$('[data-harmony]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.harmony===c.harmony));let offsets=c.harmony==='complementary'?[0,180]:c.harmony==='triadic'?[0,120,240]:c.harmony==='monochromatic'?[0]:[0,30,330],selected=offsets.map(n=>(c.hue+n)%360);const point=h=>[200+140*Math.cos((h-90)*Math.PI/180),200+140*Math.sin((h-90)*Math.PI/180)];let lines='';if(selected.length>1){let pts=selected.map(h=>point(h).join(',')).join(' ');lines=selected.length===2?`<polyline points="${pts}" fill="none" stroke="#6366f1" stroke-width="3"/>`:`<polygon points="${pts}" fill="#6366f11c" stroke="#6366f1" stroke-width="3"/>`;}

function chooseWheel(h,refocus=false){set('color.hue',Number(h));const slider=$('[data-path="color.hue"]');if(slider)slider.value=h;refreshVisuals();if(refocus)$(`[data-wheel-hue="${h}"]`)?.focus({preventScroll:true});}
document.addEventListener('click',e=>{const node=e.target.closest('[data-wheel-hue]');if(node)chooseWheel(node.dataset.wheelHue);const button=e.target.closest('[data-harmony]');if(button){set('color.harmony',button.dataset.harmony);refreshVisuals();}});
document.addEventListener('keydown',e=>{const node=e.target.closest('[data-wheel-hue]');if(!node)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseWheel(node.dataset.wheelHue,true);}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const direction=['ArrowRight','ArrowDown'].includes(e.key)?30:330;chooseWheel((Number(node.dataset.wheelHue)+direction)%360,true);}});
function contrastRows(){let c=state.color;return [['Texto / fondo',c.text,c.background],['Texto / superficie',c.text,c.surface],['Botón: texto / primario',onColor(c.primary),c.primary],['Enlace / fondo',c.primary,c.background],['Éxito / superficie',c.success,c.surface],['Error / superficie',c.error,c.surface],['Aviso / superficie',c.warning,c.surface],['Información / superficie',c.info,c.surface]]}
function contrastHTML(){return contrastRows().map(([name,a,b])=>{let n=ratio(a,b);return `<div class="ratio"><span>${name}</span><strong class="${n>=4.5?'ok':'error'}">${n.toFixed(2)}:1 · ${n>=4.5?'AA texto':'Revisar'}</strong></div>`}).join('')}
function colors(){return `${sectionHead(2,'Dale color al obrador.','Explora armonías, reparte el protagonismo y comprueba el contraste antes de decidir. Los controles siguen el laboratorio de color del tema.')}<div class="resource-links">${link('https://igarciafp.github.io/labs/colorweb.html','Abrir el laboratorio de color')}</div><section class="panel"><h2>1. Armonía cromática y rueda de color</h2><p>Selecciona un matiz en la rueda de 12 colores y una regla de armonía, como en el laboratorio de color. Después ajusta saturación y luminosidad para adaptarlo a la panadería.</p><div class="color-workbench"><div><fieldset><legend>Esquema de armonía</legend><div class="harmony-options">${Object.entries(harmonyInfo).map(([k,v])=>`<button data-harmony="${k}" aria-pressed="${state.color.harmony===k}">${v[0]}</button>`).join('')}</div></fieldset><div class="harmony-info"><h3 id="harmony-title"></h3><p id="harmony-description" class="small"></p></div><h3>Muestras generadas</h3><div id="harmony-swatches" class="swatches"></div><button id="apply-harmony" style="margin-top:16px">Aplicar a primario y secundario</button><p class="small" style="margin-top:12px">Las líneas muestran la relación entre colores. Aplicar cambia estos dos roles; conserva el resto de tu paleta. Revisa el contraste antes de darla por terminada.</p></div><div><div id="interactive-wheel"></div><p class="small">Pulsa un círculo o usa Tab y Enter. El aro oscuro identifica el matiz base.</p></div></div><details class="tint panel" style="margin-top:20px" open><summary><strong>Ajuste HSL · matiz, saturación y luminosidad</strong></summary><div class="grid three" style="margin-top:16px">${[['hue','Matiz',0,330,30],['sat','Saturación',0,100,1],['light','Luminosidad',0,100,1]].map(([k,l,min,max,step])=>`<label class="field">${l}: <output id="out-${k}">${state.color[k]}</output><input data-path="color.${k}" type="range" min="${min}" max="${max}" step="${step}" value="${state.color[k]}"></label>`).join('')}</div><p class="small">El matiz avanza por los 12 puntos de la rueda. Saturación y luminosidad cambian las muestras. Para valores exactos, utiliza los selectores HEX de la paleta.</p></details></section><section class="panel"><h2>2. Asigna un papel a cada color</h2><div class="grid three">${colorKeys.map((k,i)=>`<label class="field">${colorLabels[i]}<span class="color-row"><input type="color" data-path="color.${k}" value="${state.color[k]}" aria-label="Selector ${colorLabels[i]}"><input type="text" data-hex="${k}" value="${state.color[k]}" pattern="#[0-9a-fA-F]{6}" maxlength="7" aria-label="Hexadecimal ${colorLabels[i]}"></span></label>`).join('')}</div><p class="small">Regla orientativa 60–30–10: fondo dominante, superficies secundarias y acentos. No es una cuota rígida ni un criterio de accesibilidad.</p><div id="proportions" class="proportions"></div>${field('color.reason','Justifica la paleta','Vincula los colores con la entrevista y explica dónde usarás el primario y el secundario.','textarea')}</section><div class="grid"><section class="panel"><h2>3. Verifica el contraste</h2><div id="contrast"></div><p class="small" style="margin-top:14px">Usamos 4,5:1 como mínimo para todos estos textos normales. El texto de botón elige blanco o negro automáticamente. Los estados necesitan además una etiqueta o un icono, nunca solo color.</p>${link('https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html','Criterio WCAG de contraste')}</section><section class="panel"><h3>Decisiones que se ven</h3><div id="color-demo"></div><p class="small" style="margin-top:14px">Si la combinación falla, oscurece el texto o aclara el fondo. El PDF incluye los valores y los ratios medidos.</p></section></div>${previewBlock()}${markStep(2)}`}
function typography(){return `${sectionHead(3,'Una voz que se pueda leer.','Elige dos familias como máximo y define la jerarquía desde el móvil. Los tamaños de escritorio crecen sin cambiar el orden de importancia.')}<div class="resource-links">${link('https://fonts.google.com/','Explorar Google Fonts')}${link('https://fonts.google.com/knowledge','Aprender sobre tipografía')}</div><section class="panel"><div class="grid">${field('type.heading','Familia de títulos','Explora una serif para el carácter artesanal o una sans serif para una identidad más sobria.','select',fonts)}${field('type.body','Familia de lectura y controles','Inter y Source Sans 3 son puntos de partida legibles. Si no hay conexión, se usa una fuente de reserva.','select',fonts)}</div><label class="field">Interlineado de lectura: <output id="line-out">${state.type.line}</output><input data-path="type.line" type="range" min="1.3" max="2" step="0.05" value="${state.type.line}"></label><div class="table-wrap"><table><thead><tr><th>Uso</th><th>Móvil (px)</th><th>Escritorio (px)</th><th>Peso</th></tr></thead><tbody>${Object.entries(state.type.sizes).map(([k,v])=>`<tr><th>${esc(k.toUpperCase())}</th>${[0,1].map(i=>`<td><input aria-label="${k} ${i?'escritorio':'móvil'}" data-path="type.sizes.${k}.${i}" type="number" min="12" max="80" value="${v[i]}"></td>`).join('')}<td><select aria-label="Peso ${k}" data-path="type.sizes.${k}.2">${[400,600,700].map(n=>`<option ${n===v[2]?'selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:14px">Los niveles H1–H6 describen estructura, no se saltan solo para obtener otro tamaño. Body recomendado: 16 px o más; controles: 16 px. Longitud de línea objetivo: 45–75 caracteres.</p>${field('type.reason','¿Por qué estas familias y esta escala?','Relaciona tradición, facilidad de compra y lectura en móvil.','textarea')}</section><div class="panel"><h3>Prueba de lectura</h3><div id="type-preview" class="type-sample"></div></div>${previewBlock()}${markStep(3)}`}
const assetNames=['Hero · manos y pan artesano','Producto 1 · hogaza de masa madre','Producto 2 · barra rústica','Producto 3 · pan de semillas'];
function images(){return `${sectionHead(4,'Muestra el pan de verdad.','Incorpora cuatro imágenes: una para el hero y tres para los productos. Documenta su procedencia antes de usarlas.')}<div class="callout"><strong>La licencia forma parte de la entrega.</strong><p>Busca fotografías propias o con una licencia que permita el uso previsto. Registra autor, página original y condiciones de cada imagen; una búsqueda en Google no concede derechos. Para este caso ficticio, señala las fotos de banco como referencias.</p></div><div class="resource-links">${link('https://unsplash.com/s/photos/artisan-bread','Buscar en Unsplash')}${link('https://unsplash.com/license','Licencia Unsplash')}${link('https://www.pexels.com/search/bread/','Buscar en Pexels')}${link('https://www.pexels.com/license/','Licencia Pexels')}${link('https://squoosh.app/','Optimizar en Squoosh')}</div><p class="small">Consulta las condiciones vigentes de la foto concreta; algunas colecciones son de pago. No uses fotografías de terceros como parte del logotipo. La atribución se registrará en la guía, sea obligatoria o no.</p><section class="panel">${field('imageRule','Dirección fotográfica común','Luz, encuadre, fondo y tratamiento: una regla breve para las cuatro fotos.','textarea')}</section><div class="grid">${state.images.map((img,i)=>`<section class="panel"><h3>${assetNames[i]}</h3><div class="photo-slot">${img.data?`<img src="${img.data}" alt="${esc(img.alt||'Vista previa de la imagen seleccionada')}" style="object-position:${position(img.position)}">`:'Carga una imagen desde tu dispositivo'}</div><label class="field">Archivo PNG, JPG o WebP<input type="file" data-upload="${i}" accept="image/png,image/jpeg,image/webp"></label>${img.data?`<p class="small">${esc(img.name)} · original ${img.width} × ${img.height} px · copia para el informe ${img.kb} KB</p><button data-remove="${i}">Retirar imagen</button>`:''}${field(`images.${i}.alt`,'Texto alternativo','Describe lo relevante sin empezar por «imagen de».')}${field(`images.${i}.author`,'Autor / titular')}${field(`images.${i}.source`,'URL de la página original','Para una foto propia: «Archivo propio» y fecha. Sin enlaces a búsquedas.')}${field(`images.${i}.license`,'Licencia o permiso','Nombre de la licencia, versión o permiso del titular.')}${field(`images.${i}.proof`,'Condiciones y atribución','Indica si permite uso comercial/modificación, cómo citarás y cuándo lo consultaste.','textarea')}<div class="grid">${field(`images.${i}.crop`,'Relación de aspecto','','select',i?['4:3','1:1','3:2']:['16:9','3:2','4:3'])}${field(`images.${i}.position`,'Punto de interés','','select',[['center','Centro'],['left','Izquierda'],['right','Derecha'],['top','Arriba']])}</div></section>`).join('')}</div><div class="callout"><p><strong>Entrega técnica:</strong> el laboratorio reduce las copias a un máximo de 1200 px para guardar y exportar. Conserva los originales. Para la web: WebP/AVIF, tamaños responsivos, dimensiones declaradas; hero prioritario y productos con carga diferida. No se descarga ni se publica tu selección en un servidor.</p></div>${markStep(4)}`}
const iconUses=['Cesta / añadir pan','Contacto / teléfono','Ubicación / cómo llegar','Confirmación / pedido añadido'];

function icons(){return `${sectionHead(5,'Elige un lenguaje de iconos.','Ahora seleccionas y documentas; no tienes que integrar código ni descargar una biblioteca. Usa una sola familia y un mismo estilo.')}<div class="resource-links">${link('https://fontawesome.com/search?ic=free','Font Awesome Free')}${link('https://icons.getbootstrap.com/','Bootstrap Icons')}${link('https://lucide.dev/icons/','Lucide')}${link('https://fontawesome.com/license/free','Licencia Font Awesome Free')}</div><section class="panel"><div class="grid">${field('icons.family','Familia','','select',['Font Awesome Free','Bootstrap Icons','Lucide'])}${field('icons.style','Estilo elegido','Comprueba que los cuatro iconos están disponibles en este estilo.','select',['Solid','Regular / contorno','Trazo lineal'])}${field('icons.source','URL del catálogo')}${field('icons.license','Licencia y atribución','Registra la licencia de los iconos seleccionados, no la del sitio web.')}</div><div class="callout"><p><strong>Sugerencia para tu familia:</strong> <span id="icon-hints"></span>. Busca cada nombre en el catálogo y comprueba que es gratuito o que tienes permiso.</p></div><div class="icon-catalog">${iconUses.map((use,i)=>`<div class="icon-spec">${field(`icons.items.${i}`,use,'Anota nombre exacto y URL del icono elegido.')}</div>`).join('')}</div>${field('icons.size','Tamaño base (px)','Propón 20–24 px, dentro de un área pulsable de al menos 44 × 44 px en este proyecto.','number')}${field('icons.rule','Reglas de uso y accesibilidad','Define trazo/relleno, color y etiquetas. Ej.: iconos decorativos ocultos al lector de pantalla; acciones con nombre visible.','textarea')}<p class="small">Una lupa o una cesta no sustituyen por sí solas una etiqueta clara. En la maqueta usamos nombres de acciones; el PDF documenta tu selección de iconos para la siguiente fase de implementación.</p></section>${markStep(5)}`}
function writing(){return `${sectionHead(6,'Escribe como hablaría el obrador.','Redacta mensajes cortos, útiles y amables. Explica qué pasa y cuál es el siguiente paso, especialmente cuando algo falla.')}<div class="callout"><p>«Hablamos de tú, sin culpar a nadie». Evita «Error 422» o «Has introducido mal el correo». Mejor: «Revisa el correo: necesitamos una dirección como nombre@dominio.es».</p></div><section class="panel">${field('writing.voice','Voz y tono','Define tratamiento, formalidad y términos que usarás de forma consistente.','textarea')}<div class="grid">${field('writing.hero','Titular del hero','Ej.: Pan artesano, del obrador a tu mesa.')}${field('writing.cta','Acción principal','Ej.: Elegir mi pan. El botón lleva al catálogo.')}${field('writing.add','Botón de compra de producto','Ej.: Añadir a la cesta.')}${field('writing.success','Producto añadido','Ej.: Pan añadido. Puedes seguir eligiendo o ver tu cesta.')}${field('writing.error','Error de correo en contacto','Indica cómo corregirlo, sin culpabilizar.','textarea')}${field('writing.empty','Cesta vacía','Da contexto y una salida para continuar.','textarea')}${field('writing.contact','Confirmación del mensaje de contacto','Agradece e indica un plazo realista del caso ficticio.','textarea')}${field('writing.avoid','Qué evitamos y alternativa correcta','Un ejemplo de «no usar / usar» para mantener el tono.','textarea')}</div><p class="small">Para acciones de compra, diferencia «Añadir a la cesta» de «Confirmar pedido». El precio total y la franja de recogida se revisan antes de confirmar.</p></section>${previewBlock()}${markStep(6)}`}
const optionSets={button:[['suave','Cercano','Esquinas de 10 px, botón sólido y acción clara.'],['recto','Sobrio','Esquinas de 2 px, estructura compacta.'],['pill','Redondo','Cápsula, más amable y expresiva.']],card:[['borde','Ficha con borde','Delimitación clara, foto 4:3 y datos visibles.'],['sombra','Tarjeta elevada','Sombra ligera para separar del fondo.'],['plana','Ficha editorial','Más aire y división inferior, sin sombra.']],field:[['borde','Campo enmarcado','Borde completo y etiqueta siempre visible.'],['relleno','Campo con fondo','Superficie diferenciada y borde inferior.'],['linea','Línea inferior','Aspecto ligero; el foco refuerza el contorno.']],modal:[['centrado','Diálogo centrado','Resumen de pedido centrado.'],['lateral','Panel lateral','Resumen desde el lateral en escritorio.'],['inferior','Panel inferior','Hoja inferior en móvil.']]};

function vars(){let c=state.color;return `--p:${c.primary};--s:${c.secondary};--bg:${c.background};--tx:${c.text};--surface:${c.surface};--success:${c.success};--err:${c.error};--on:${onColor(c.primary)};--rad:${radius()}px;--body:${fontStack(state.type.body)};--heading:${fontStack(state.type.heading)};--h1m:${state.type.sizes.h1[0]}px;`}
function components(){return `${sectionHead(7,'Construye una familia de componentes.','Compara variantes ya adaptadas a tu paleta. Elige por coherencia y facilidad de compra, no solo por decoración.')}<div class="ui-demo" style="${vars()}">${Object.entries(optionSets).map(([k,opts],i)=>`<section class="panel"><h2>${i+1}. ${['Botones','Tarjetas de producto','Campos de formulario','Resumen de pedido'][i]}</h2><div class="ui-options">${opts.map(([v,label,desc])=>`<label class="ui-option"><input type="radio" name="ui-${k}" data-path="ui.${k}" value="${v}" ${state.ui[k]===v?'checked':''}> <strong>${label}</strong><div class="mini" style="${vars()}">${mini(k,v)}</div><small>${desc}</small></label>`).join('')}</div></section>`).join('')}</div><section class="panel"><div class="grid">${field('ui.spacing','Unidad de espaciado','','select',[[4,'4 px · escala 4, 8, 12, 16, 24'],[8,'8 px · escala 8, 16, 24, 32, 48'],[12,'12 px · escala 12, 24, 36, 48, 72']])}${field('ui.owner','Responsable y revisión','Ej.: Elena valida; equipo de diseño mantiene; revisar cada trimestre.')}</div>${field('ui.reason','Justifica tus componentes','Relaciona tus elecciones con la facilidad de compra y las personas que usarán la web.','textarea')}${field('ui.changelog','Historial de esta versión','','textarea')}</section><section class="panel"><h2>Los seis estados no son opcionales</h2><p>Estas muestras documentan el botón de compra. El foco conserva un contorno visible; la carga y los errores tienen texto.</p><div id="state-examples"></div><p class="small" style="margin-top:14px">Un diálogo de pedido debe recibir el foco al abrirse, contenerlo hasta cerrar, admitir Escape y devolverlo al botón de origen. El patrón seleccionado se documenta aquí; no se implementa un checkout real.</p></section>${previewBlock()}${markStep(7)}`}
function mini(k,v){let c=state.color;if(k==='button')return `<span style="background:${c.primary};color:${onColor(c.primary)};padding:10px 16px;border-radius:${{suave:10,recto:2,pill:99}[v]}px">Añadir pan</span>`;if(k==='card')return `<span style="padding:10px;background:${c.surface};color:${c.text};border:${v==='borde'?'1px solid '+c.text:'none'};box-shadow:${v==='sombra'?'0 3px 10px #0002':'none'};border-bottom:${v==='plana'?'2px solid '+c.secondary:''};border-radius:6px;font-size:13px">▧ &nbsp; Hogaza · 3,80 €</span>`;if(k==='field')return `<span style="width:80%;font-size:12px;color:${c.text}">Correo electrónico<span style="display:block;background:${v==='relleno'?c.secondary:c.surface};border:${v==='borde'?'1px solid '+c.text:'0'};border-bottom:1px solid ${c.text};height:25px"></span></span>`;return `<span style="width:90%;height:64px;border:1px solid #b5bbc5;display:flex;align-items:${v==='inferior'?'end':'center'};justify-content:${v==='lateral'?'end':'center'};background:#e1e3e6"><span style="display:block;background:${c.surface};color:${c.text};border:1px solid ${c.primary};width:${v==='inferior'?'100%':'65%'};padding:8px;font-size:11px">Tu pedido · 3,80 €</span></span>`;}
function stateExamples(){const c=state.color;return `<div class="state-grid ui-demo" style="${vars()}">${[['Default',''],['Hover',`background:${mix(c.primary,.14)};color:${onColor(mix(c.primary,.14))}`],['Focus',`outline:3px solid ${c.text};outline-offset:3px;border:2px solid ${c.surface}`],['Active',`background:${mix(c.primary,.25)};color:${onColor(mix(c.primary,.25))}`],['Disabled','background:#e2e5e9;color:#525b68;border-color:#bbc3cf'],['Loading','']].map(([l,st])=>`<div class="state-card"><strong>${l}</strong><span class="buy" style="display:inline-block;padding:10px 12px;${st}">${l==='Loading'?'Añadiendo…':esc(state.writing.add||'Añadir pan')}</span></div>`).join('')}</div>`}
function position(v){return {left:'left center',right:'right center',top:'center top',center:'center'}[v]||'center'}
function photo(i){let a=state.images[i];return a.data?`<img src="${a.data}" alt="${esc(a.alt)}" style="object-position:${position(a.position)}">`:`<span>${i?'Fotografía de producto':'Fotografía del obrador'}</span>`}
function shopHTML(){let w=state.writing,c=state.color;return `<div class="shop ${previewDevice==='mobile'?'mobile':''}" style="${vars()}"><header>${logoMark()}<nav aria-label="Páginas de la maqueta"><button data-preview-page="landing">Inicio / tienda</button><button data-preview-page="contacto">Contacto</button></nav></header><div class="shop-body">${previewPage==='landing'?`<div class="hero"><div><p class="eyebrow" style="color:${c.primary}">Tradición · Masa madre · Barrio</p><h2 style="font-size:${previewDevice==='mobile'?state.type.sizes.h1[0]:state.type.sizes.h1[1]}px;font-weight:${state.type.sizes.h1[2]}">${esc(w.hero||'Pan de barrio, hecho con tiempo.')}</h2><p style="font-size:${state.type.sizes.body[previewDevice==='mobile'?0:1]}px;line-height:${state.type.line}">Fermentación lenta, corteza crujiente y recogida en tu panadería de siempre.</p><button class="buy" data-shop="catalog">${esc(w.cta||'Elegir mi pan')}</button></div><div class="image" style="aspect-ratio:${state.images[0].crop.replace(':','/')}">${photo(0)}</div></div><div class="section-head"><h3>Nuestros panes de cada día</h3><div><button data-slide="-1" aria-label="Productos anteriores">←</button> <button data-slide="1" aria-label="Productos siguientes">→</button></div></div><div class="products" tabindex="0" aria-label="Carrusel de productos; desplaza para ver más">${['Hogaza de masa madre','Barra rústica','Pan de semillas'].map((n,i)=>`<article class="product" style="${state.ui.card==='sombra'?'box-shadow:0 4px 12px #0002':state.ui.card==='plana'?'border:0;border-bottom:2px solid '+c.secondary:''}"><div class="image" style="aspect-ratio:${state.images[i+1].crop.replace(':','/')}">${photo(i+1)}</div><h3>${n}</h3><p>${['500 g · 3,80 €','250 g · 1,40 €','450 g · 3,50 €'][i]}</p><p>Contiene gluten${i===2?' y sésamo':''}.</p><button class="buy" data-shop="add">${esc(w.add||'Añadir a la cesta')}</button></article>`).join('')}</div><p class="small" id="shop-feedback" role="status" style="color:${c.text};margin-top:12px">Maqueta de diseño · precios ficticios · no se realizan compras.</p>`:`<h2>Hablemos de pan</h2><div class="contact-grid"><div><p>Plaza del Trigo, 8<br>Lunes a sábado · 7:30–14:30<br>900 000 000<br>hola@migasamigas.example</p><div class="image" style="aspect-ratio:16/9">Plano de ubicación · referencia</div><p class="small" style="margin-top:10px">Todos los datos son ficticios.</p></div><div><label>Nombre (obligatorio)<input aria-label="Nombre de ejemplo" placeholder="Tu nombre" style="${fieldStyle()}"></label><label>Correo (obligatorio)<input type="email" aria-label="Correo de ejemplo" placeholder="nombre@dominio.es" style="${fieldStyle()}"></label><label>Mensaje (obligatorio)<textarea aria-label="Mensaje de ejemplo" rows="3" style="${fieldStyle()}"></textarea></label><p class="small" style="color:${c.text}">Usaremos estos datos para responder a tu consulta. En producción: enlazar información de privacidad.</p><button class="buy" data-shop="contact">Enviar mensaje</button><p id="shop-feedback" role="status" class="small" style="color:${c.text};margin-top:10px">Formulario de muestra. No se envían datos.</p></div></div>`}</div><footer>Pan artesano · Recogida en tienda · Contacto · Privacidad</footer></div>`;}
function fieldStyle(){return state.ui.field==='relleno'?`background:${state.color.secondary};border:0;border-bottom:2px solid ${state.color.text}`:state.ui.field==='linea'?`border:0;border-bottom:2px solid ${state.color.text};border-radius:0`:''}

function valid(n){let e=[],need=(v,t)=>{if(!String(v??'').trim())e.push(t)};if(n===1){for(const k of ['mission','vision','audience','evidence','logoNote'])need(state.identity[k],{mission:'Completa la misión.',vision:'Completa la visión.',audience:'Define el público.',evidence:'Relaciona una decisión con la entrevista.',logoNote:'Explica la adaptación del imagotipo.'}[k]);if(state.identity.values.length<3)e.push('Elige al menos tres valores.');if(state.identity.slogan.length>48)e.push('Reduce el lema a 48 caracteres.');}
if(n===2){need(state.color.reason,'Justifica la paleta.');contrastRows().forEach(([name,a,b])=>{if(ratio(a,b)<4.5)e.push(`${name}: ajusta la combinación hasta 4,5:1.`)});}
if(n===3){need(state.type.reason,'Justifica las familias y la escala.');for(const [k,v] of Object.entries(state.type.sizes)){if(v[0]<12||v[1]<12||v[0]>80||v[1]>80)e.push(`${k}: usa tamaños de 12 a 80 px.`);if(v[1]<v[0])e.push(`${k}: el tamaño de escritorio debe ser igual o mayor que el móvil.`);}if(state.type.sizes.body[0]<16||state.type.sizes.button[0]<16)e.push('Usa al menos 16 px para lectura y botones en este proyecto.');for(let i=1;i<6;i++)if(state.type.sizes['h'+i][0]<state.type.sizes['h'+(i+1)][0]||state.type.sizes['h'+i][1]<state.type.sizes['h'+(i+1)][1])e.push('Mantén una escala de títulos descendente de H1 a H6.');}
if(n===4){need(state.imageRule,'Describe el estilo fotográfico.');state.images.forEach((x,i)=>{if(!x.data)e.push(`Falta la imagen ${i+1}.`);for(const k of ['author','source','license','proof','alt'])need(x[k],`Imagen ${i+1}: falta ${ {author:'autor',source:'procedencia',license:'licencia',proof:'condiciones de uso',alt:'texto alternativo'}[k]}.`);});}
if(n===5){for(const k of ['license','source','rule'])need(state.icons[k],'Completa '+{license:'la licencia de los iconos.',source:'la URL del catálogo.',rule:'las reglas de iconografía.'}[k]);state.icons.items.forEach((x,i)=>need(x,'Selecciona el icono de '+iconUses[i]+'.'));if(state.icons.size<16||state.icons.size>32)e.push('Elige un tamaño base de icono entre 16 y 32 px.');}
if(n===6)Object.entries(state.writing).forEach(([k,v])=>need(v,'Completa '+{voice:'la voz',hero:'el titular',cta:'la acción principal',add:'el botón de compra',success:'el mensaje de añadido',error:'el error de correo',empty:'la cesta vacía',contact:'la confirmación de contacto',avoid:'el ejemplo de texto a evitar'}[k]+'.'));
if(n===7){need(state.ui.reason,'Justifica la elección de componentes.');need(state.ui.owner,'Asigna responsable y frecuencia de revisión.');need(state.ui.changelog,'Registra los cambios de esta versión.');}
return e;}
function review(){return `${sectionHead(8,'De decisiones a una guía compartida.','Comprueba los siete pasos. El documento reunirá entrevista, wireframes, identidad y normas de uso con tus imágenes y selecciones.')}<section class="panel"><div class="grid">${field('student','Alumno o equipo')}${field('group','Grupo (opcional)')}${field('version','Versión de la guía')}${field('date','Fecha','','date')}</div>${names.slice(1,8).map((n,i)=>{let errors=valid(i+1);return `<div class="review-item"><div><strong>${i+1}. ${n}</strong><p class="${errors.length?'error':state.reviewed[i]?'ok':''}">${errors.length?errors.length+' datos por completar':state.reviewed[i]?'✓ Revisado':'Completo · pendiente de marcar como revisado'}</p></div><button data-go="${i+1}">Revisar</button></div>`}).join('')}<div class="callout"><p><strong>Exportación a PDF:</strong> pulsa «Generar guía» para verla y después «Guardar PDF». Se abrirá el diálogo de impresión: elige <strong>Guardar como PDF</strong>, A4, escala 100 %, sin cabeceras/pies del navegador y con gráficos de fondo. En móvil, usa la opción de guardar o compartir PDF del sistema.</p></div><div class="actions"><button class="primary" id="generate">Generar guía completa</button><button id="draft">Ver borrador</button></div><div id="review-errors" role="status" class="bad-list"></div><p class="small" style="margin-top:18px">Se exportan tus decisiones actuales, no una solución predeterminada. Las licencias y la adecuación real de las imágenes requieren revisión humana.</p></section>`}

out+=sheet('Wireframes · Móvil primero',`<p>Una columna; compra visible; carrusel manual y formulario con etiquetas. Tamaño de referencia: 375 px. Las flechas y las acciones tendrán un área mínima de 44 × 44 px.</p><div class="mobile-wires"><div><h3>Landing / tienda</h3>${wireSVG('landing','mobile')}</div><div><h3>Contacto</h3>${wireSVG('contacto','mobile')}</div></div>`);
out+=sheet('Wireframe · Landing en escritorio',`<p>Desde 900 px: hero en dos columnas y tres tarjetas de producto visibles. Contenedor máximo de 1200 px, espacio lateral y orden de lectura conservado.</p><div class="desktop-wire">${wireSVG('landing','desktop')}</div><h3>Comportamiento del carrusel</h3><p>Desplazamiento manual con flechas, teclado y gesto horizontal. Sin avance automático. Nombre, peso, precio, ingredientes/alérgenos y botón de compra acompañan a cada producto. La cesta confirma el añadido y permite revisar antes de confirmar.</p>`);
out+=sheet('Wireframe · Contacto en escritorio',`<p>Información de la panadería a la izquierda y formulario a la derecha. En móvil se apilan en ese mismo orden.</p><div class="desktop-wire">${wireSVG('contacto','desktop')}</div><p>Nombre, correo y mensaje con etiquetas permanentes y campos obligatorios identificados. Errores con instrucciones junto al campo. La información de privacidad debe concretarse antes de una publicación real.</p>`);
out+=sheet('1 · Identidad y marca',`${rows([['Misión',state.identity.mission],['Visión',state.identity.vision],['Público',state.identity.audience],['Valores',state.identity.values.join(', ')],['Personalidad',state.identity.personality],['Evidencia de la entrevista',state.identity.evidence]])}<h3>Imagotipo</h3><div class="report-logo">${logo}</div><p>${esc(state.identity.logoNote)}</p><p><strong>Lema:</strong> ${esc(state.identity.slogan)}</p><h3>Normas de uso</h3><p>Símbolo y nombre pueden separarse. Conservar proporciones; dejar alrededor una zona libre equivalente a la altura de la M. Ancho mínimo propuesto: 160 px horizontal / 120 px vertical. Comprobar reproducción en una tinta. No deformar, rotar, añadir sombras ni colocar sobre fondos que dificulten su lectura.</p><p class="small">Base SVG original de este ejercicio, disponible para adaptación educativa. El alumno debe documentar los derechos de cualquier recurso externo que añada.</p>`);
out+=sheet('2 · Paleta y contraste',`<p>${esc(c.reason)}</p><div class="swatches">${colorKeys.map((k,i)=>`<div class="swatch"><i style="background:${c[k]}"></i><small>${esc(colorLabels[i].split(' · ')[0])}<br>${c[k]}</small></div>`).join('')}</div><h3>Aplicación</h3><p>Primario: acciones principales, marca y enlaces. Secundario: bloques decorativos. Fondo dominante y superficies tranquilas; texto para lectura. Estados: éxito, error, aviso e información acompañados de texto o icono. La proporción 60–30–10 es orientativa.</p><table><thead><tr><th>Combinación</th><th>Ratio calculado</th><th>Texto normal AA</th></tr></thead><tbody>${contrastRows().map(([name,a,b])=>`<tr><td>${name}<br><small>${a} / ${b}</small></td><td>${ratio(a,b).toFixed(2)}:1</td><td>${ratio(a,b)>=4.5?'Cumple 4,5:1':'Revisar'}</td></tr>`).join('')}</tbody></table><p class="small">Ratios WCAG calculados sobre colores sólidos. En fotografías, transparencias y estados derivados, comprobar la composición final. Las muestras hover y active usan un primario más oscuro con texto blanco o negro recalculado.</p>`);
out+=sheet('3 · Sistema tipográfico',`<p>${esc(t.reason)}</p>${rows([['Títulos',t.heading+'; reserva '+(['Lora','Playfair Display','Georgia'].includes(t.heading)?'serif':'sans-serif')],['Lectura y controles',t.body+'; reserva '+(['Lora','Playfair Display','Georgia'].includes(t.body)?'serif':'sans-serif')],['Interlineado','Títulos 1,15–1,2; lectura '+t.line+'; longitud de línea 45–75 caracteres.']])}<table><thead><tr><th>Uso</th><th>Móvil px / rem</th><th>Escritorio px / rem</th><th>Peso</th></tr></thead><tbody>${Object.entries(t.sizes).map(([k,v])=>`<tr><th>${k.toUpperCase()}</th><td>${v[0]} / ${(v[0]/16).toFixed(2)}</td><td>${v[1]} / ${(v[1]/16).toFixed(2)}</td><td>${v[2]}</td></tr>`).join('')}</tbody></table><p class="small">Conversión rem con base de 16 px. Tamaños de escritorio a partir de 900 px. Mantener jerarquía semántica H1–H6 y permitir zoom; no fijar alturas que corten texto.</p><div class="type-sample" style="margin-top:16px"><p style="font-family:${fontStack(t.heading)};font-size:${t.sizes.h1[0]}px;font-weight:${t.sizes.h1[2]};line-height:1.15">Pan que sabe a barrio.</p><p style="font-family:${fontStack(t.body)};font-size:${t.sizes.body[0]}px;line-height:${t.line}">Elige tu pan y recógelo en tu panadería de siempre.</p></div><p class="small">Fuentes web: Google Fonts; verificar la licencia de cada familia. La exportación usa la fuente cargada o su reserva si no hay conexión.</p>`);
out+=sheet('4 · Dirección de imágenes',`<p>${esc(state.imageRule)}</p><p>Objetivo: representar pan real con un tratamiento coherente. Las fotos de banco son referencias para este caso ficticio; no atribuirlas al obrador como si fueran propias.</p><h3>Preparación para la web</h3><p>Conservar originales. Producir variantes WebP/AVIF responsivas con dimensiones declaradas. Hero prioritario; carga diferida para productos fuera de pantalla. Revisar recorte, texto alternativo y peso por separado de la calidad visual. Copias del informe limitadas a 1200 px.</p>${imgSpec(0)}`);
for(let i=1;i<4;i++)out+=sheet(`4 · Imagen de producto ${i}`,imgSpec(i));
out+=sheet('5 · Iconografía',`${rows([['Familia',state.icons.family],['Estilo',state.icons.style],['Tamaño',state.icons.size+' px; área pulsable del proyecto: al menos 44 × 44 px'],['Licencia / atribución',state.icons.license],['Normas de uso',state.icons.rule]])}<p>Catálogo: ${sourceLink(state.icons.source)}</p><table><thead><tr><th>Uso</th><th>Selección del alumno</th></tr></thead><tbody>${iconUses.map((u,i)=>`<tr><th>${u}</th><td>${esc(state.icons.items[i])}</td></tr>`).join('')}</tbody></table><h3>Accesibilidad y coherencia</h3><p>Una misma familia, rejilla y tratamiento de trazo. No depender solo del color para comunicar estados. Acompañar las acciones de texto; iconos decorativos ocultos a tecnologías de asistencia y botones con nombre accesible.</p><p class="small">Este paso registra una selección para su integración posterior. Los iconos externos no están incrustados en la maqueta ni en este PDF.</p>`);
out+=sheet('6 · UX writing',`${rows([['Voz y tono',w.voice],['Titular del hero',w.hero],['Acción principal',w.cta],['Compra de producto',w.add],['Confirmación de añadido',w.success],['Error de correo',w.error],['Cesta vacía',w.empty],['Mensaje de contacto',w.contact],['No usar / usar',w.avoid]])}<h3>Reglas transversales</h3><p>Usar los mismos nombres en navegación, botones y mensajes. Verbo de acción y consecuencia explícita. Diferenciar añadir a la cesta de confirmar un pedido. Indicar total y franja de recogida antes de confirmar; mantener los datos al corregir errores.</p>`);
out+=sheet('7 · Componentes seleccionados',`<p>${esc(state.ui.reason)}</p><div class="grid ui-demo" style="${vars()}">${Object.keys(optionSets).map((k,i)=>`<div class="panel"><h3>${['Botón','Tarjeta','Campo','Resumen de pedido'][i]}</h3>${mini(k,state.ui[k])}<p style="margin-top:12px">${esc(optionSets[k].find(o=>o[0]===state.ui[k])?.[1]||'Pendiente')}</p></div>`).join('')}</div>${rows([['Botón','Etiqueta de acción, relleno primario, texto '+onColor(c.primary)+', radio '+radius()+' px y área mínima de 44 px.'],['Tarjeta','Imagen, nombre del pan, peso, precio, ingredientes/alérgenos y acción de compra. En móvil, carrusel manual; tres tarjetas en escritorio.'],['Campo','Etiqueta permanente, ayuda, entrada y mensaje de error. Tipografía legible; teclado adecuado para correo.'],['Diálogo','Título, resumen, total, confirmar y cancelar/cerrar. Foco inicial, Escape, contención del foco y restauración al cerrar.'],['Espaciado','Unidad de '+state.ui.spacing+' px; múltiplos coherentes en márgenes, rellenos y separación.']])}`);
out+=sheet('7 · Estados y comportamiento',`${stateExamples()}<h3>Campos, tarjetas y diálogo</h3><table><thead><tr><th>Estado</th><th>Regla</th></tr></thead><tbody>${[['Default','Borde y etiqueta legibles, precio y acción claros.'],['Hover','Refuerzo de borde o fondo; no desplazar el contenido.'],['Focus','Contorno de 3 px en color de texto con separación; nunca quitar el foco.'],['Active','Confirmación visual de la pulsación.'],['Disabled','Estilo neutro, motivo visible y sin interacción. No desactivar sin explicar.'],['Loading','Texto de progreso; impedir envío duplicado sin borrar datos.'],['Error / éxito','Texto e icono además del color semántico; asociar mensaje al campo y anunciar confirmaciones.']].map(x=>`<tr><th>${x[0]}</th><td>${x[1]}</td></tr>`).join('')}</tbody></table><p>El carrusel no se mueve automáticamente. El formulario conserva los datos ante errores y muestra un resumen de confirmación. La maqueta no tramita operaciones reales.</p>`);
let oldD=previewDevice,oldP=previewPage;previewDevice='desktop';previewPage='landing';out+=sheet('Aplicación · Landing / tienda',shopHTML());previewPage='contacto';out+=sheet('Aplicación · Contacto',shopHTML());previewDevice=oldD;previewPage=oldP;
out+=sheet('Tokens y mantenimiento',`<pre>${esc(token)}</pre>${rows([['Responsable y revisión',state.ui.owner],['Versión / fecha',state.version+' · '+state.date],['Historial de cambios',state.ui.changelog]])}<h3>Cómo mantener la guía</h3><p>Proponer el cambio, comprobar contraste y lectura en móvil, probar teclado y estados, validar con Elena y actualizar versión, fecha e historial. Mantener la guía y los componentes sincronizados.</p><h3>Usos correctos / incorrectos</h3><p>Sí: fotos coherentes y con permiso, compra visible, etiquetas permanentes, un solo lenguaje de iconos. No: deformar el imagotipo, esconder el precio, reemplazar etiquetas por placeholders, eliminar el foco o usar color como única señal.</p><p class="small">Recursos: ${link('https://fonts.google.com/','Google Fonts')} · ${link('https://fontawesome.com/license/free','Licencia Font Awesome')} · ${link('https://unsplash.com/license','Licencia Unsplash')} · ${link('https://www.pexels.com/license/','Licencia Pexels')} · ${link('https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html','Contraste WCAG')}.</p>`);
return out;}
function generate(draft){const errors=[];if(!draft){if(!state.student.trim())errors.push('Indica el alumno o equipo.');if(!state.version.trim()||!state.date)errors.push('Indica versión y fecha.');for(let n=1;n<=7;n++){let e=valid(n);if(e.length)errors.push(`Paso ${n}: ${e[0]}`);else if(!state.reviewed[n-1])errors.push(`Marca el paso ${n} como revisado.`);}}if(errors.length){$('#review-errors').innerHTML='<p class="error" style="margin-top:16px">Antes de generar la guía completa:</p><ul>'+errors.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>';return;}$('#review-errors').textContent='';$('#report').className='report report-preview';$('#report').innerHTML=`<div class="report-toolbar panel" style="max-width:790px;margin:0 auto 20px"><h2>${draft?'Borrador de tu guía':'Tu guía está preparada'}</h2><p>Revisa las páginas. Para crear el PDF, elige «Guardar como PDF» en la impresión del navegador.</p><button class="primary" id="print-report">Guardar ${draft?'borrador en ':''}PDF</button> <button id="close-report">Cerrar vista previa</button></div>`+reportHTML(draft);$('#report').scrollIntoView({behavior:'smooth'});}
async function printReport(){const btn=$('#print-report');btn.disabled=true;btn.textContent='Preparando imágenes y fuentes…';try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,5000))]);await Promise.all($$('#report img').map(i=>i.decode().catch(()=>{})));document.title='Guía de estilo - Migas Amigas - '+(state.student||'Borrador');window.print();}finally{btn.disabled=false;btn.textContent='Guardar PDF';}}
function download(content,name,type='text/plain'){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function loadImage(file,logo=false){if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Elige una imagen PNG, JPG o WebP.');if(file.size>15*1024*1024)throw Error('Reduce la imagen a menos de 15 MB antes de cargarla.');let url=URL.createObjectURL(file);try{const im=new Image();im.src=url;await im.decode();if(im.naturalWidth*im.naturalHeight>40000000)throw Error('Reduce las dimensiones de la imagen antes de cargarla.');const scale=Math.min(1,(logo?800:1200)/Math.max(im.naturalWidth,im.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(im.naturalWidth*scale);canvas.height=Math.round(im.naturalHeight*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let data=canvas.toDataURL(logo?'image/png':'image/jpeg',.78);if(data.length>1600000)throw Error('La copia sigue siendo demasiado grande. Optimiza el archivo y vuelve a intentarlo.');return {data,name:file.name,width:im.naturalWidth,height:im.naturalHeight,kb:Math.ceil(data.length*.75/1024)};}finally{URL.revokeObjectURL(url)}}
document.addEventListener('input',e=>{let el=e.target;if(el.matches('[data-path]')&&!['radio','checkbox','file'].includes(el.type)){let p=el.dataset.path,v=el.value;if(el.type==='number'||el.type==='range'||p.startsWith('type.sizes.')||p==='ui.spacing')v=Number(v);if(typeof v==='number'&&!Number.isFinite(v))return;set(p,v);if(el.type==='color'){let hex=$(`[data-hex="${p.split('.')[1]}"]`);if(hex)hex.value=v;}refreshVisuals();}if(el.dataset.hex&&/^#[\da-f]{6}$/i.test(el.value)){set('color.'+el.dataset.hex,el.value.toLowerCase());$(`[data-path="color.${el.dataset.hex}"]`).value=el.value;refreshVisuals();}});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.value){state.identity.values=$$('[data-value]:checked').map(x=>x.dataset.value);invalidate();save();}if(el.type==='radio'&&el.dataset.path){set(el.dataset.path,el.value);refreshVisuals();}if(el.dataset.path&&el.tagName==='SELECT'&&el.dataset.path==='icons.family'){state.icons.source={'Font Awesome Free':'https://fontawesome.com/search?ic=free','Bootstrap Icons':'https://icons.getbootstrap.com/','Lucide':'https://lucide.dev/icons/'}[state.icons.family];state.icons.style=state.icons.family==='Lucide'?'Trazo lineal':state.icons.family==='Bootstrap Icons'?'Regular / contorno':'Solid';render();save();}if(el.dataset.hex&&!/^#[\da-f]{6}$/i.test(el.value)){el.value=state.color[el.dataset.hex];notify('Usa un hexadecimal completo, por ejemplo #854526.');}if(el.dataset.upload!==undefined){const which=el.dataset.upload;try{let data=await loadImage(el.files[0],which==='logo');if(which==='logo')state.identity.customLogo=data.data;else Object.assign(state.images[Number(which)],data);invalidate();save();render();notify('Imagen incorporada a tu trabajo.');}catch(err){notify(err.message);el.value='';}}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
if(b.dataset.go!==undefined){go(Number(b.dataset.go));return;}
if(b.dataset.check){let n=Number(b.dataset.check),errors=valid(n);$('#step-errors').innerHTML=errors.length?'<ul class="error">'+errors.map(x=>'<li>'+esc(x)+'</li>').join(''):'<p class="ok">✓ Decisiones completas. Paso revisado.</p>';state.reviewed[n-1]=errors.length===0;updateNav();save();if(!errors.length)b.textContent='✓ Paso revisado';return;}
if(b.dataset.wfPage){wfPage=b.dataset.wfPage;render();return;}if(b.dataset.wfDevice){wfDevice=b.dataset.wfDevice;render();return;}
if(b.dataset.previewDevice){previewDevice=b.dataset.previewDevice;render();return;}if(b.dataset.previewPage){previewPage=b.dataset.previewPage;refreshVisuals();return;}
if(b.dataset.remove!==undefined){if(b.dataset.remove==='logo')state.identity.customLogo='';else Object.assign(state.images[Number(b.dataset.remove)],{data:'',name:'',width:0,height:0,kb:0});invalidate();save();render();return;}
if(b.dataset.slide){let track=b.closest('.shop').querySelector('.products');track.scrollBy({left:Number(b.dataset.slide)*track.clientWidth*.85,behavior:'smooth'});return;}
if(b.dataset.shop){let shop=b.closest('.shop');if(b.dataset.shop==='catalog')shop.querySelector('.products')?.scrollIntoView({behavior:'smooth',block:'center'});else{let feed=shop.querySelector('#shop-feedback');if(feed)feed.textContent=b.dataset.shop==='add'?(state.writing.success||'Pan añadido a la cesta de muestra.')+' (Simulación sin compra)':(state.writing.contact||'Mensaje recibido.')+' (Simulación: no se envían datos)';}return;}
if(b.id==='download-navigation')download(navigationSVG(false),'migas-amigas-mapa-navegacion.svg','image/svg+xml');
if(b.id==='download-wire')download(wireSVG(wfPage,wfDevice),`migas-amigas-${wfPage}-${wfDevice}.svg`,'image/svg+xml');
if(b.id==='download-logo')download(logoSVG(),'migas-amigas-imagotipo-base.svg','image/svg+xml');
if(b.id==='apply-harmony'){let h=harmony();state.color.primary=h[0];state.color.secondary=h[1];invalidate();save();render();notify('Paleta aplicada. Revisa los contrastes antes de continuar.');}
if(b.id==='backup'){download(JSON.stringify(state,null,2),'migas-amigas-mi-guia.json','application/json');notify('Copia descargada con tus respuestas e imágenes.');}
if(b.id==='restore')$('#restore-file').click();
if(b.id==='generate')generate(false);if(b.id==='draft')generate(true);if(b.id==='print-report')printReport();if(b.id==='close-report'){$('#report').className='report';$('#report').innerHTML='';$('#content').scrollIntoView({behavior:'smooth'});}
});
$('#restore-file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('La copia supera el máximo de 10 MB.');let next=safeImport(JSON.parse(await f.text()));if(!confirm('Abrir esta copia sustituirá el trabajo actual de este navegador. ¿Continuar?'))return;state=next;go(state.step);notify('Trabajo recuperado. Revisa los pasos antes de exportar.');}catch(err){notify('No se pudo abrir: '+err.message);}finally{e.target.value='';}});
try{let raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);state=safeImport(parsed);state.reviewed=initial.reviewed.map((_,i)=>parsed.reviewed?.[i]===true&&valid(i+1).length===0);}}catch(e){notify('No se pudo recuperar el guardado local. Puedes abrir una copia JSON.');}
active=state.step;render();

</script>
