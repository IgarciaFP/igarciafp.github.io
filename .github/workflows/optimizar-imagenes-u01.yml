name: Optimizar imágenes de DWEC U01

on:
  workflow_dispatch:
  push:
    branches:
      - codex/optimizar-imagenes-u01
    paths:
      - .github/workflows/optimizar-imagenes-u01.yml

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4
        with:
          ref: codex/optimizar-imagenes-u01

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Sharp
        run: npm install --no-save sharp@0.34.3

      - name: Extraer y convertir imágenes
        run: node scripts/optimizar-imagenes-u01.mjs

      - name: Validar los cambios
        run: |
          git diff --check
          test -n "$(find ciclos/dwec/assets/u01 -type f -print -quit)"
          ! grep -q 'fetch("dwec01.html")' ciclos/dwec/u01_es.html
          ! grep -q 'data-source-image=' ciclos/dwec/u01_es.html

      - name: Guardar imágenes optimizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ciclos/dwec/u01_es.html ciclos/dwec/assets/u01
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Optimiza imágenes de DWEC U01"
            git push
          fi
