name: Traducir HTML

on:
  push:
    branches:
      - main
    paths:
      - 'ciclos/diw/u01_es.html'
      - 'ciclos/dwec/u01_es.html'
      - 'ciclos/ssii/u01_es.html'
      - 'traducir.py'
      - '.github/workflows/traducir.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traducir-html-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install 'deep-translator==1.11.4' 'beautifulsoup4>=4.12,<5'

      - name: Traducir archivos
        run: python -u traducir.py

      - name: Guardar cambios en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ciclos/diw/u01_en.html ciclos/dwec/u01_en.html ciclos/ssii/u01_en.html

          if git diff --staged --quiet; then
            echo "La traducción no produjo cambios."
            exit 0
          fi

          git commit -m "Traducción automática de unidades HTML"
          git push
