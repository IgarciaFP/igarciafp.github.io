name: Traducir HTML

on:
  push:
    branches:
      - main
    paths:
      - 'ciclos/diw/u01_es.html'
      - 'ciclos/dwec/u01_es.html'
      - 'ciclos/dwec/u02_es.html'
      - 'ciclos/ssii/u01_es.html'
      - 'traducir.py'
      - 'requirements-translate.txt'
      - '.github/workflows/traducir.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'traducir.py'
      - 'requirements-translate.txt'
      - '.github/workflows/traducir.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: traducir-html-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DOWNLOAD_TIMEOUT: '60'
  HF_HUB_ETAG_TIMEOUT: '30'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-translate.txt'

      - name: Instalar PyTorch para CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'

      - name: Instalar dependencias
        run: python -m pip install -r requirements-translate.txt

      - name: Restaurar caché del modelo
        id: cache-modelo
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: marian-es-en-c96e2c5399eb

      - name: Descargar modelo si no está en caché
        if: steps.cache-modelo.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="Helsinki-NLP/opus-mt-es-en",
              revision="c96e2c5399ebfae4fc43d9669556b9afa74bb69d",
          )
          PY

      - name: Probar traductor offline
        if: github.event_name == 'pull_request'
        run: python -u traducir.py --smoke-test
        env:
          HF_HUB_OFFLINE: '1'

      - name: Traducir archivos
        if: github.event_name != 'pull_request'
        run: python -u traducir.py
        env:
          HF_HUB_OFFLINE: '1'

      - name: Guardar cambios en GitHub
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ciclos/diw/u01_en.html ciclos/dwec/u01_en.html ciclos/dwec/u02_en.html ciclos/ssii/u01_en.html

          if git diff --staged --quiet; then
            echo "La traducción no produjo cambios."
            exit 0
          fi

          git commit -m "Traducción automática de unidades HTML"
          git push

      - name: Publicar traducciones en GitHub Pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
